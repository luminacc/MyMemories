<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist Kita - Luminacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #1a0033, #2d1b69, #4a1a6b);
      font-family: 'Poppins', sans-serif;
      color: #e0d0f0;
      min-height: 100vh;
      padding-top: 120px;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #1a0033, #2d1b69);
      color: white;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,0.4);
    }

    header h1 { margin: 0; font-size: 2.2rem; }
    header p { margin: 8px 0 0; font-size: 1rem; color: #c0a0e0; }

    .back-btn {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12); border: none; color: white;
      padding: 8px 15px; border-radius: 20px; cursor: pointer;
      text-decoration: none; font-size: 16px; transition: background 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }

    .container {
      max-width: 1200px; margin: 0 auto; padding: 30px 20px;
    }

    .filter-tabs {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
      margin-bottom: 30px;
    }

    .filter-tab {
      padding: 10px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      cursor: pointer;
      color: #c0a0e0;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .filter-tab:hover { background: rgba(255,255,255,0.15); color: white; }

    .filter-tab.active {
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(155,89,182,0.4);
    }

    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .playlist-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s forwards;
    }

    .playlist-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-video {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }

    .card-video iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .card-info {
      padding: 18px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .card-artist {
      font-size: 0.85rem;
      color: #b0a0c8;
      margin-bottom: 10px;
    }

    .card-mood {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .mood-romantis { background: rgba(233,30,99,0.2); color: #f48fb1; }
    .mood-sedih { background: rgba(33,150,243,0.2); color: #90caf9; }
    .mood-bahagia { background: rgba(255,193,7,0.2); color: #ffe082; }
    .mood-semangat { background: rgba(76,175,80,0.2); color: #a5d6a7; }

    .card-actions {
      display: flex; gap: 8px; margin-top: 12px;
    }

    .card-action-btn {
      flex: 1; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #c0a0e0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
      text-align: center;
    }

    .card-action-btn:hover {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .card-action-btn.delete-btn:hover {
      background: rgba(244,67,54,0.3);
      color: #ef9a9a;
    }

    .add-song-btn {
      display: block;
      margin: 0 auto 30px;
      padding: 14px 35px;
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .add-song-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(155,89,182,0.5);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8070a0;
    }

    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 15px; }
    .empty-state p { font-size: 1.1rem; }

    .modal {
      display: none;
      position: fixed; z-index: 2000;
      left: 0; top: 0; width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(26,0,51,0.9);
    }

    .modal-content {
      background-color: #2d1b69;
      margin: 10% auto;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-content h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: #d4a0ff;
      margin-bottom: 20px;
      text-align: center;
    }

    .close {
      color: #8070a0; float: right;
      font-size: 28px; font-weight: bold;
    }

    .close:hover { color: white; cursor: pointer; }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block; margin-bottom: 5px;
      font-weight: 600; color: #c0a0e0; font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%; padding: 12px 15px;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 10px; box-sizing: border-box;
      background: rgba(255,255,255,0.06);
      color: #e0d0f0; font-family: 'Poppins', sans-serif;
      font-size: 0.95rem; transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none; border-color: #9b59b6;
    }

    .form-group select option { background: #2d1b69; color: #e0d0f0; }

    .submit-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
      color: white; border: none; border-radius: 25px;
      cursor: pointer; font-size: 1rem; font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(155,89,182,0.4);
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 100px; }
      header { padding: 15px; }
      header h1 { font-size: 1.8rem; }
      header p { font-size: 0.9rem; }
      .back-btn { padding: 6px 12px; font-size: 14px; }

      .playlist-grid { grid-template-columns: 1fr; }
    }

    @media screen and (max-width: 576px) {
      body { padding-top: 90px; }
      header h1 { font-size: 1.5rem; }

      .filter-tabs { gap: 6px; }
      .filter-tab { padding: 8px 14px; font-size: 0.8rem; }

      .playlist-grid { gap: 15px; }

      .modal-content { width: 95%; margin: 15% auto; padding: 20px; }
    }

    @media screen and (max-width: 400px) {
      .filter-tab { padding: 6px 10px; font-size: 0.75rem; }
      .card-info { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Kembali</a>
    <h1>Playlist Kita</h1>
    <p>Lagu-lagu kenangan kita bersama</p>
  </header>

  <div class="container">
    <div class="filter-tabs">
      <div class="filter-tab active" data-mood="all">Semua</div>
      <div class="filter-tab" data-mood="Romantis">Romantis</div>
      <div class="filter-tab" data-mood="Sedih">Sedih</div>
      <div class="filter-tab" data-mood="Bahagia">Bahagia</div>
      <div class="filter-tab" data-mood="Semangat">Semangat</div>
    </div>

    <button class="add-song-btn" id="addSongBtn">+ Tambah Lagu</button>

    <div class="playlist-grid" id="playlistGrid"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">🎵</div>
      <p>Belum ada lagu. Tambahkan lagu pertama kita!</p>
    </div>
  </div>

  <div id="songModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Tambah Lagu Baru</h2>
      <form id="songForm">
        <div class="form-group">
          <label for="songTitle">Judul Lagu</label>
          <input type="text" id="songTitle" placeholder="Nama lagu..." required />
        </div>
        <div class="form-group">
          <label for="songArtist">Artis</label>
          <input type="text" id="songArtist" placeholder="Nama artis..." required />
        </div>
        <div class="form-group">
          <label for="songUrl">YouTube URL</label>
          <input type="url" id="songUrl" placeholder="https://www.youtube.com/watch?v=..." required />
        </div>
        <div class="form-group">
          <label for="songMood">Mood</label>
          <select id="songMood" required>
            <option value="Romantis">Romantis</option>
            <option value="Sedih">Sedih</option>
            <option value="Bahagia">Bahagia</option>
            <option value="Semangat">Semangat</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">Tambahkan ke Playlist</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      Timestamp,
      doc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9cFVC1vIgLpr9SH8qvIQOqGTZnfBlgTQ",
      authDomain: "luminac-6437a.firebaseapp.com",
      projectId: "luminac-6437a",
      storageBucket: "luminac-6437a.firebasestorage.app",
      messagingSenderId: "476684760512",
      appId: "1:476684760512:web:ae8d4f26bd4f6d00194425",
      measurementId: "G-MVX1E12SY7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentFilter = 'all';

    function extractYouTubeId(url) {
      if (!url) return null;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /^([a-zA-Z0-9_-]{11})$/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    function formatDate(dateValue) {
      const dateObj = dateValue?.toDate ? dateValue.toDate() : new Date(dateValue);
      return dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function createPlaylistCard(data, index) {
      const card = document.createElement('div');
      card.className = 'playlist-card';
      card.style.animationDelay = (index * 0.08) + 's';
      card.dataset.id = data.id;
      card.dataset.mood = data.mood;

      const videoId = extractYouTubeId(data.url);
      const embedUrl = videoId ? `https://www.youtube.com/embed/${videoId}` : '';

      const moodClass = {
        'Romantis': 'mood-romantis',
        'Sedih': 'mood-sedih',
        'Bahagia': 'mood-bahagia',
        'Semangat': 'mood-semangat'
      }[data.mood] || 'mood-romantis';

      card.innerHTML = `
        <div class="card-video">
          ${embedUrl ? `<iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8070a0;">Video tidak tersedia</div>'}
        </div>
        <div class="card-info">
          <div class="card-title">${data.title}</div>
          <div class="card-artist">${data.artist} &middot; ${formatDate(data.addedAt)}</div>
          <span class="card-mood ${moodClass}">${data.mood}</span>
          <div class="card-actions">
            <button class="card-action-btn play-btn" data-url="${data.url}">Putar</button>
            <button class="card-action-btn delete-btn" data-id="${data.id}">Hapus</button>
          </div>
        </div>
      `;

      card.querySelector('.play-btn').addEventListener('click', () => {
        if (videoId) window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
      });

      card.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm(`Hapus "${data.title}" dari playlist?`)) {
          await deleteDoc(doc(db, "playlistItems", data.id));
        }
      });

      return card;
    }

    function renderPlaylist(filter = 'all') {
      const grid = document.getElementById('playlistGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      const q = query(collection(db, "playlistItems"), orderBy("addedAt", "desc"));
      onSnapshot(q, (snapshot) => {
        grid.innerHTML = '';
        let items = [];

        snapshot.forEach(d => {
          const data = d.data();
          data.id = d.id;
          if (filter === 'all' || data.mood === filter) {
            items.push(data);
          }
        });

        if (items.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        items.forEach((item, i) => {
          grid.appendChild(createPlaylistCard(item, i));
        });
      });
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.mood;
        renderPlaylist(currentFilter);
      });
    });

    const modal = document.getElementById('songModal');
    const form = document.getElementById('songForm');

    document.getElementById('addSongBtn').addEventListener('click', () => {
      modal.style.display = 'block';
    });

    document.getElementsByClassName('close')[0].addEventListener('click', () => {
      modal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('songTitle').value.trim();
      const artist = document.getElementById('songArtist').value.trim();
      const url = document.getElementById('songUrl').value.trim();
      const mood = document.getElementById('songMood').value;

      if (!extractYouTubeId(url)) {
        alert('URL YouTube tidak valid! Gunakan format: https://www.youtube.com/watch?v=...');
        return;
      }

      try {
        await addDoc(collection(db, "playlistItems"), {
          title,
          artist,
          url,
          mood,
          addedAt: Timestamp.now()
        });

        form.reset();
        modal.style.display = 'none';
      } catch (error) {
        console.error("Gagal menambahkan lagu:", error);
        alert("Gagal menyimpan: " + error.message);
      }
    });

    renderPlaylist();
  </script>
</body>
</html>
