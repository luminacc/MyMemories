<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kisah Cinta Kita - Luminacc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #2d0a1a 0%, #6b1d3a 25%, #d4527a 55%, #8b2252 100%);
      font-family: 'Poppins', sans-serif;
      color: #fce4ec;
      min-height: 100vh;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, rgba(45,10,26,0.95), rgba(107,29,58,0.95));
      backdrop-filter: blur(10px);
      color: #f8bbd0;
      z-index: 1000;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }

    header h1 {
      margin: 0;
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      text-shadow: 0 2px 10px rgba(248,187,208,0.3);
    }

    header p { margin: 6px 0 0; font-size: 0.95rem; color: #f48fb1; }

    .back-btn {
      position: absolute;
      left: 20px; top: 50%;
      transform: translateY(-50%);
      background: rgba(248,187,208,0.15);
      border: 1px solid rgba(248,187,208,0.3);
      color: #f8bbd0;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s;
    }

    .back-btn:hover { background: rgba(248,187,208,0.25); }

    .main-content {
      position: relative;
      z-index: 2;
      padding: 120px 20px 40px;
      max-width: 800px;
      margin: 0 auto;
    }

    .story-intro {
      text-align: center;
      padding: 40px 20px;
      margin-bottom: 20px;
    }

    .story-intro h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #f8bbd0;
      margin-bottom: 10px;
    }

    .story-intro p {
      font-size: 1rem;
      color: #f48fb1;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .timeline {
      position: relative;
      padding: 20px 0;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: linear-gradient(to bottom, rgba(248,187,208,0.1), rgba(248,187,208,0.4), rgba(248,187,208,0.1));
      border-radius: 2px;
    }

    .chapter {
      position: relative;
      margin-bottom: 50px;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s, transform 0.7s;
    }

    .chapter.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .chapter:nth-child(odd) .chapter-card { margin-left: auto; margin-right: calc(50% + 25px); }
    .chapter:nth-child(even) .chapter-card { margin-left: calc(50% + 25px); }

    .chapter-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      background: #d4527a;
      border: 3px solid #fce4ec;
      border-radius: 50%;
      top: 25px;
      z-index: 5;
      box-shadow: 0 0 15px rgba(212,82,122,0.4);
    }

    .chapter-card {
      width: calc(50% - 40px);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(248,187,208,0.2);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(5px);
      transition: transform 0.3s;
    }

    .chapter-card:hover {
      transform: translateY(-3px);
    }

    .chapter-number {
      font-family: 'Dancing Script', cursive;
      font-size: 0.9rem;
      color: #f48fb1;
      margin-bottom: 5px;
      display: block;
    }

    .chapter-title {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #f8bbd0;
      margin-bottom: 10px;
    }

    .chapter-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(248,187,208,0.15);
    }

    .chapter-text {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #fce4ec;
    }

    .chapter-date {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #f48fb1;
      padding: 4px 12px;
      background: rgba(248,187,208,0.1);
      border-radius: 12px;
      border: 1px solid rgba(248,187,208,0.15);
    }

    .add-btn {
      display: block;
      margin: 40px auto;
      padding: 14px 30px;
      background: linear-gradient(135deg, #d4527a, #f48fb1);
      color: #2d0a1a;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .add-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(212,82,122,0.4);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #f48fb1;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.4;
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(45,10,26,0.85);
    }

    .modal-content {
      background: linear-gradient(135deg, #6b1d3a, #3d0c1c);
      margin: 12% auto;
      padding: 25px;
      border-radius: 16px;
      width: 90%;
      max-width: 550px;
      box-shadow: 0 5px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(248,187,208,0.2);
    }

    .modal-content h2 {
      font-family: 'Dancing Script', cursive;
      color: #f8bbd0;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.6rem;
    }

    .close {
      color: #f48fb1;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover { color: #ffffff; }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #f8bbd0;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(248,187,208,0.3);
      border-radius: 8px;
      box-sizing: border-box;
      background: rgba(0,0,0,0.3);
      color: #fce4ec;
      font-family: 'Poppins', sans-serif;
    }

    .form-group textarea { height: 120px; resize: vertical; }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: rgba(244,143,177,0.4); }

    .submit-btn {
      background: linear-gradient(135deg, #d4527a, #f48fb1);
      color: #2d0a1a;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: transform 0.3s;
    }

    .submit-btn:hover { transform: translateY(-2px); }

    @media screen and (max-width: 768px) {
      header { padding: 15px; }
      header h1 { font-size: 1.6rem; }
      header p { font-size: 0.85rem; }
      .back-btn { padding: 6px 12px; font-size: 13px; }
      .main-content { padding: 110px 15px 30px; }
      .timeline::before { left: 20px; }
      .chapter-dot { left: 20px; }
      .chapter:nth-child(odd) .chapter-card,
      .chapter:nth-child(even) .chapter-card {
        margin-left: 50px;
        margin-right: 0;
        width: calc(100% - 50px);
      }
      .chapter-title { font-size: 1.3rem; }
      .chapter-card { padding: 18px; }
      .chapter-image { max-height: 200px; }
    }

    @media screen and (max-width: 576px) {
      header h1 { font-size: 1.4rem; }
      .main-content { padding: 100px 12px 25px; }
      .chapter:nth-child(odd) .chapter-card,
      .chapter:nth-child(even) .chapter-card {
        margin-left: 40px;
        width: calc(100% - 40px);
      }
      .chapter-dot { left: 15px; width: 14px; height: 14px; }
      .timeline::before { left: 15px; }
      .chapter-card { padding: 15px; }
      .chapter-image { max-height: 180px; }
      .modal-content { width: 95%; margin: 15% auto; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    <h1>Kisah Cinta Kita</h1>
    <p>Perjalanan cinta dari awal hingga sekarang</p>
  </header>

  <div class="main-content">
    <div class="story-intro">
      <h2>Cerita Tentang Kita</h2>
      <p>Setiap babak dalam kisah cinta kita adalah halaman indah yang tak pernah ingin kita hapus dari ingatan.</p>
    </div>

    <div class="timeline" id="storyTimeline">
      <div class="empty-state" id="emptyState" style="display:none;">
        <i class="fas fa-book-open"></i>
        <p>Belum ada bab cerita. Tulis kisah cinta kita!</p>
      </div>
    </div>

    <button class="add-btn" id="addBtn">+ Tulis Bab Baru</button>
  </div>

  <div id="chapterModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Tulis Bab Baru</h2>
      <form id="chapterForm">
        <div class="form-group">
          <label for="chapterNum">Nomor Bab</label>
          <input type="number" id="chapterNum" min="1" placeholder="1" required>
        </div>
        <div class="form-group">
          <label for="chapterTitle">Judul Bab</label>
          <input type="text" id="chapterTitle" placeholder="Contoh: Pertama Kali Bertemu" required>
        </div>
        <div class="form-group">
          <label for="chapterContent">Cerita</label>
          <textarea id="chapterContent" placeholder="Tuliskan kisah indah di bab ini..." required></textarea>
        </div>
        <div class="form-group">
          <label for="chapterDate">Tanggal</label>
          <input type="date" id="chapterDate" required>
        </div>
        <div class="form-group">
          <label for="chapterImage">URL Gambar (opsional)</label>
          <input type="url" id="chapterImage" placeholder="https://example.com/photo.jpg">
        </div>
        <button type="submit" class="submit-btn">Simpan Bab</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, onSnapshot,
      query, orderBy, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9cFVC1vIgLpr9SH8qvIQOqGTZnfBlgTQ",
      authDomain: "luminac-6437a.firebaseapp.com",
      projectId: "luminac-6437a",
      storageBucket: "luminac-6437a.firebasestorage.app",
      messagingSenderId: "476684760512",
      appId: "1:476684760512:web:ae8d4f26bd4f6d00194425",
      measurementId: "G-MVX1E12SY7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function formatDate(dateValue) {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      const dateObj = dateValue?.toDate ? dateValue.toDate() : new Date(dateValue);
      return dateObj.toLocaleDateString('id-ID', options);
    }

    function convertGoogleDriveLink(link) {
      if (!link) return '';
      link = link.trim();
      let match = link.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) match = link.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/uc?export=view&id=${match[1]}`;
      }
      return link;
    }

    function createChapterElement(data) {
      const chapter = document.createElement('div');
      chapter.className = 'chapter';
      chapter.dataset.chapter = data.chapter;

      const imgHtml = data.image
        ? `<img src="${data.image}" alt="${data.title}" class="chapter-image" loading="lazy"
               onerror="this.style.display='none';">`
        : '';

      chapter.innerHTML = `
        <div class="chapter-dot"></div>
        <div class="chapter-card">
          <span class="chapter-number">Bab ${data.chapter}</span>
          <div class="chapter-title">${data.title}</div>
          ${imgHtml}
          <div class="chapter-text">${data.content}</div>
          <span class="chapter-date"><i class="fas fa-calendar-alt"></i> ${formatDate(data.date)}</span>
        </div>
      `;
      return chapter;
    }

    let allChapters = [];

    function renderChapters() {
      const timeline = document.getElementById('storyTimeline');
      const empty = document.getElementById('emptyState');

      timeline.innerHTML = '';

      if (allChapters.length === 0) {
        timeline.appendChild(empty);
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      allChapters.sort((a, b) => a.chapter - b.chapter);

      allChapters.forEach(ch => {
        timeline.appendChild(createChapterElement(ch));
      });

      setTimeout(setupScrollObserver, 200);
    }

    function setupScrollObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.15 });

      document.querySelectorAll('.chapter').forEach(ch => observer.observe(ch));
    }

    function listenToChapters() {
      const q = query(collection(db, 'loveChapters'), orderBy('chapter', 'asc'));
      onSnapshot(q, (snapshot) => {
        allChapters = [];
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          data.id = docSnap.id;
          allChapters.push(data);
        });
        renderChapters();
      });
    }

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const chapters = document.querySelectorAll('.chapter:not(.visible)');
          chapters.forEach(ch => {
            const rect = ch.getBoundingClientRect();
            if (rect.top < window.innerHeight * 0.85) {
              ch.classList.add('visible');
            }
          });
          ticking = false;
        });
        ticking = true;
      }
    });

    const modal = document.getElementById('chapterModal');
    const addBtn = document.getElementById('addBtn');
    const span = document.getElementsByClassName('close')[0];
    const form = document.getElementById('chapterForm');

    addBtn.onclick = () => modal.style.display = 'block';
    span.onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.textContent = 'Menyimpan...';
      submitBtn.disabled = true;

      try {
        const rawLink = document.getElementById('chapterImage').value;
        const imageUrl = convertGoogleDriveLink(rawLink);

        await addDoc(collection(db, 'loveChapters'), {
          chapter: parseInt(document.getElementById('chapterNum').value),
          title: document.getElementById('chapterTitle').value,
          content: document.getElementById('chapterContent').value,
          date: Timestamp.fromDate(new Date(document.getElementById('chapterDate').value)),
          image: imageUrl
        });
        form.reset();
        modal.style.display = 'none';
      } catch (err) {
        alert('Gagal menyimpan: ' + err.message);
      } finally {
        submitBtn.textContent = 'Simpan Bab';
        submitBtn.disabled = false;
      }
    };

    listenToChapters();
  </script>
</body>
</html>
