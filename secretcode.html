<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kode Rahasia Kita - Luminacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0d0221 0%, #150734 25%, #1a0a47 50%, #0c1445 75%, #060d2b 100%);
      font-family: 'Poppins', sans-serif;
      color: #e0d4ff;
      min-height: 100vh;
      padding-top: 130px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 20px 20px 18px;
      background: linear-gradient(135deg, #0d0221 0%, #150734 40%, #1a0a47 100%);
      color: white;
      z-index: 1000;
      box-shadow: 0 4px 25px rgba(100, 0, 255, 0.25);
      border-bottom: 1px solid rgba(138, 43, 226, 0.3);
    }

    header h1 {
      margin: 0;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      background: linear-gradient(135deg, #ff6ec7, #a855f7, #6ee7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.85rem;
      color: #b794f4;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(138, 43, 226, 0.2);
      border: 1px solid rgba(138, 43, 226, 0.4);
      color: #c4b5fd;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s;
      backdrop-filter: blur(5px);
    }

    .back-btn:hover {
      background: rgba(138, 43, 226, 0.4);
      color: #fff;
      transform: translateY(-50%) scale(1.05);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .add-section {
      background: rgba(20, 10, 50, 0.6);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }

    .add-section h2 {
      font-size: 1.1rem;
      color: #a855f7;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      min-width: 200px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #c4b5fd;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(138, 43, 226, 0.4);
      border-radius: 10px;
      box-sizing: border-box;
      background: rgba(15, 5, 40, 0.8);
      color: #e0d4ff;
      font-size: 0.95rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
    }

    .form-group input::placeholder {
      color: rgba(138, 43, 226, 0.5);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn-generate {
      background: linear-gradient(135deg, #6ee7b7, #3b82f6);
      color: #0d0221;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(110, 231, 183, 0.4);
    }

    .btn-submit {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
    }

    .codes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .code-card {
      background: rgba(20, 10, 50, 0.7);
      border: 1px solid rgba(138, 43, 226, 0.25);
      border-radius: 16px;
      padding: 22px;
      position: relative;
      backdrop-filter: blur(8px);
      transition: all 0.3s;
      animation: cardIn 0.4s ease-out;
      overflow: hidden;
    }

    .code-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #a855f7, #ec4899, #6ee7b7);
    }

    .code-card:hover {
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 8px 30px rgba(138, 43, 226, 0.2);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .code-label {
      font-size: 0.75rem;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .code-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #6ee7ff;
      margin-bottom: 12px;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(110, 231, 255, 0.3);
    }

    .meaning-label {
      font-size: 0.7rem;
      color: #b794f4;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .meaning-value {
      font-size: 0.95rem;
      color: #d8b4fe;
      line-height: 1.5;
    }

    .code-meta {
      margin-top: 12px;
      font-size: 0.72rem;
      color: rgba(183, 148, 244, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-actions {
      display: flex;
      gap: 8px;
    }

    .code-actions button {
      background: rgba(138, 43, 226, 0.2);
      border: 1px solid rgba(138, 43, 226, 0.3);
      color: #c4b5fd;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .code-actions button:hover {
      background: rgba(138, 43, 226, 0.5);
      color: #fff;
    }

    .code-actions button.delete-btn:hover {
      background: rgba(239, 68, 68, 0.5);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(183, 148, 244, 0.6);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 16px;
      display: block;
      color: rgba(138, 43, 226, 0.3);
    }

    .empty-state p {
      font-size: 1rem;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.3s ease, opacity 0.3s;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 110px; }
      header { padding: 15px; }
      header h1 { font-size: 1.6rem; }
      header p { font-size: 0.8rem; }
      .back-btn { padding: 6px 12px; font-size: 13px; }
      .container { padding: 15px; }
      .add-section { padding: 18px; }
      .form-row { flex-direction: column; }
      .form-group { min-width: 100%; }
      .codes-grid { grid-template-columns: 1fr; }
    }

    @media screen and (max-width: 576px) {
      body { padding-top: 100px; }
      header h1 { font-size: 1.4rem; }
      .code-value { font-size: 1.3rem; }
      .btn-row { flex-direction: column; }
      .btn-generate, .btn-submit { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    <h1><i class="fas fa-lock"></i> Kode Rahasia Kita</h1>
    <p>Kode-kode khusus untuk kita berdua</p>
  </header>

  <div class="container">
    <div class="add-section">
      <h2><i class="fas fa-plus-circle"></i> Tambah Kode Baru</h2>
      <form id="codeForm">
        <div class="form-row">
          <div class="form-group">
            <label for="codeInput">Kode Rahasia</label>
            <input type="text" id="codeInput" placeholder="Contoh: 🌙" required>
          </div>
          <div class="form-group">
            <label for="meaningInput">Arti / Makna</label>
            <input type="text" id="meaningInput" placeholder="Contoh: Selamat tidur, sayang" required>
          </div>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-generate" id="generateBtn">
            <i class="fas fa-dice"></i> Generate Kode Random
          </button>
          <button type="submit" class="btn-submit">
            <i class="fas fa-save"></i> Simpan Kode
          </button>
        </div>
      </form>
    </div>

    <div class="codes-grid" id="codesGrid"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <i class="fas fa-key"></i>
      <p>Belum ada kode rahasia. Buat kode pertama kalian!</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    import { db } from './js/firebase-config.js';
    import {
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      doc,
      deleteDoc,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const codeForm = document.getElementById('codeForm');
    const codeInput = document.getElementById('codeInput');
    const meaningInput = document.getElementById('meaningInput');
    const generateBtn = document.getElementById('generateBtn');
    const codesGrid = document.getElementById('codesGrid');
    const emptyState = document.getElementById('emptyState');
    const toast = document.getElementById('toast');

    const codeSymbols = [
      '🌙', '⭐', '🔥', '💎', '🦋', '🌸', '💫', '🎵', '🌈', '💫',
      '🐻', '🍯', '🍓', '🧸', '💋', '🌹', '🎁', '🧸', '🎀', '🫧',
      '🕊️', '🌊', '🌻', '🐱', '🐰', '🦊', '🐼', '🐨', '🦝', '🐾',
      '✨', '🪐', '🌙', '☀️', '🍀', '🌺', '🪷', '🫶', '💑', '💏',
      'AA', 'BB', 'XY', 'XX', '007', '444', '777', '1314', '520', '3344'
    ];

    const codeAdjectives = [
      'Super', 'Ultra', 'Mega', 'Secret', 'Magic', 'Power', 'Cosmic', 'Luna',
      'Star', 'Moon', 'Sun', 'Love', 'Honey', 'Sweet', 'Baby', 'My'
    ];

    function generateRandomCode() {
      const symbol = codeSymbols[Math.floor(Math.random() * codeSymbols.length)];
      const adj = codeAdjectives[Math.floor(Math.random() * codeAdjectives.length)];
      const num = Math.floor(Math.random() * 99) + 1;
      const formats = [
        symbol,
        `${adj}${num}`,
        `${symbol} ${adj}`,
        `${adj} ${symbol}`,
        `${num}${symbol}`,
        `${symbol}${symbol}`
      ];
      return formats[Math.floor(Math.random() * formats.length)];
    }

    generateBtn.addEventListener('click', () => {
      codeInput.value = generateRandomCode();
      codeInput.focus();
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function formatDate(dateValue) {
      const d = dateValue?.toDate ? dateValue.toDate() : new Date(dateValue);
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderCodes(snapshot) {
      codesGrid.innerHTML = '';
      if (snapshot.empty) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement('div');
        card.className = 'code-card';
        card.innerHTML = `
          <div class="code-label">Kode</div>
          <div class="code-value">${data.code}</div>
          <div class="meaning-label">Arti</div>
          <div class="meaning-value">${data.meaning}</div>
          <div class="code-meta">
            <span>${formatDate(data.createdAt)}</span>
            <div class="code-actions">
              <button class="copy-btn" title="Salin kode"><i class="fas fa-copy"></i></button>
              <button class="delete-btn" title="Hapus"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;

        card.querySelector('.copy-btn').addEventListener('click', () => {
          const text = `${data.code} = ${data.meaning}`;
          navigator.clipboard.writeText(text).then(() => {
            showToast('Kode berhasil disalin!');
          }).catch(() => {
            showToast('Gagal menyalin');
          });
        });

        card.querySelector('.delete-btn').addEventListener('click', async () => {
          if (confirm('Hapus kode rahasia ini?')) {
            await deleteDoc(doc(db, 'secretCodes', id));
            showToast('Kode dihapus');
          }
        });

        codesGrid.appendChild(card);
      });
    }

    codeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      const meaning = meaningInput.value.trim();
      if (!code || !meaning) return;

      await addDoc(collection(db, 'secretCodes'), {
        code,
        meaning,
        createdBy: 'user',
        createdAt: Timestamp.now()
      });

      codeInput.value = '';
      meaningInput.value = '';
      showToast('Kode rahasia ditambahkan!');
    });

    const q = query(collection(db, 'secretCodes'), orderBy('createdAt', 'desc'));
    onSnapshot(q, renderCodes);
  </script>
</body>
</html>
