<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Countdown - Luminacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #212121, #616161);
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      min-height: 100vh;
      padding-top: 120px;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #212121, #424242);
      color: white;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,0.4);
    }

    header h1 { margin: 0; font-size: 2.2rem; font-family: 'Dancing Script', cursive; }
    header p { margin: 8px 0 0; font-size: 1rem; color: #ccc; }

    .back-btn {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 8px 15px; border-radius: 20px; cursor: pointer;
      text-decoration: none; font-size: 16px; transition: background 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }

    .container {
      max-width: 900px; margin: 0 auto; padding: 30px 20px;
      display: flex; flex-direction: column; align-items: center;
    }

    .countdown-wrapper {
      display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
      margin: 40px 0;
    }

    .countdown-box {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 30px 20px;
      min-width: 130px;
      text-align: center;
      transition: transform 0.3s;
    }
    .countdown-box:hover { transform: translateY(-5px); }

    .countdown-number {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .countdown-label {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .romantic-message {
      text-align: center;
      margin: 30px 0;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .romantic-message .msg-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: #ff9ff3;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s, transform 0.8s;
    }

    .romantic-message .msg-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    .romantic-message .msg-sub {
      font-size: 0.95rem;
      color: #aaa;
      margin-top: 10px;
    }

    .heart-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      opacity: 0;
      animation: floatHeart linear forwards;
    }

    @keyframes floatHeart {
      0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.5); }
      10% { opacity: 0.7; }
      90% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-110vh) rotate(360deg) scale(1); }
    }

    .anniversary-date {
      text-align: center;
      margin-top: 20px;
      padding: 20px 30px;
      background: rgba(255,255,255,0.06);
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .anniversary-date .date-label { font-size: 0.85rem; color: #aaa; }
    .anniversary-date .date-value {
      font-size: 1.3rem;
      color: #ff9ff3;
      margin-top: 5px;
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 100px; }
      header { padding: 15px; }
      header h1 { font-size: 1.8rem; }
      header p { font-size: 0.9rem; }
      .back-btn { padding: 6px 12px; font-size: 14px; }

      .countdown-number { font-size: 2.8rem; }
      .countdown-box { min-width: 110px; padding: 25px 15px; }
      .romantic-message .msg-text { font-size: 1.4rem; }
    }

    @media screen and (max-width: 576px) {
      body { padding-top: 90px; }
      header h1 { font-size: 1.5rem; }

      .countdown-wrapper { gap: 12px; }
      .countdown-box { min-width: 42%; padding: 20px 12px; }
      .countdown-number { font-size: 2.2rem; }
      .countdown-label { font-size: 0.75rem; letter-spacing: 1px; }
      .romantic-message .msg-text { font-size: 1.2rem; }
    }

    @media screen and (max-width: 400px) {
      .countdown-box { min-width: 42%; }
      .countdown-number { font-size: 1.8rem; }
      .romantic-message .msg-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Kembali</a>
    <h1>Love Countdown</h1>
    <p>Hitung mundur ke hari spesial kita</p>
  </header>

  <div class="heart-container" id="heartContainer"></div>

  <div class="container">
    <div class="countdown-wrapper">
      <div class="countdown-box">
        <div class="countdown-number" id="days">000</div>
        <div class="countdown-label">Hari</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-number" id="hours">00</div>
        <div class="countdown-label">Jam</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-number" id="minutes">00</div>
        <div class="countdown-label">Menit</div>
      </div>
      <div class="countdown-box">
        <div class="countdown-number" id="seconds">00</div>
        <div class="countdown-label">Detik</div>
      </div>
    </div>

    <div class="romantic-message">
      <div class="msg-text active" id="romanticMsg"></div>
      <div class="msg-sub" id="romanticSub"></div>
    </div>

    <div class="anniversary-date">
      <div class="date-label">Tanggal Spesial Kita</div>
      <div class="date-value">19 Januari 2027</div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    const TARGET_DATE = new Date('2027-01-19T00:00:00');

    const messages = [
      { text: "Setiap detik bersamamu adalah anugerah terindah", sub: "untuk hari yang ditunggu" },
      { text: "Cinta kita akan selalu bertahan, menanti hari bahagia", sub: "sampai waktu yang ditentukan" },
      { text: "Kamu adalah alasan aku tersenyum setiap hari", sub: "untuk masa depan kita" },
      { text: "Jarak dan waktu takkan mampu memisahkan cinta kita", sub: "menuju hari spesial" },
      { text: "Aku mencintaimu lebih dari kata-kata bisa ungkapkan", sub: "selalu dan selamanya" },
      { text: "Setiap hari tanpamu terasa begitu lama", sub: "hingga kita bersua kembali" },
      { text: "Kamu adalah rumah tempat hatiku berlabuh", sub: "menanti hari yang indah" },
      { text: "Cinta ini tumbuh setiap hari, semakin kuat dan nyata", sub: "untuk selamanya" },
      { text: "Mimpiku selalu tentangmu dan masa depan kita", sub: "hari yang dinanti" },
      { text: "Hati ini hanya untukmu, hari ini dan selamanya", sub: "countdown cinta kita" }
    ];

    let currentMsgIndex = 0;

    function updateCountdown() {
      const now = new Date();
      const diff = TARGET_DATE - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '0';
        document.getElementById('minutes').textContent = '0';
        document.getElementById('seconds').textContent = '0';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    function cycleMessage() {
      const msgText = document.getElementById('romanticMsg');
      const msgSub = document.getElementById('romanticSub');

      msgText.classList.remove('active');

      setTimeout(() => {
        msgText.textContent = messages[currentMsgIndex].text;
        msgSub.textContent = messages[currentMsgIndex].sub;
        msgText.classList.add('active');
        currentMsgIndex = (currentMsgIndex + 1) % messages.length;
      }, 400);
    }

    function createHeart() {
      const container = document.getElementById('heartContainer');
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = ['❤', '💕', '💖', '💗', '💘'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (14 + Math.random() * 20) + 'px';
      heart.style.animationDuration = (6 + Math.random() * 8) + 's';
      heart.style.animationDelay = Math.random() * 2 + 's';
      container.appendChild(heart);

      setTimeout(() => heart.remove(), 15000);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    cycleMessage();
    setInterval(cycleMessage, 4000);

    setInterval(createHeart, 800);
    for (let i = 0; i < 6; i++) {
      setTimeout(createHeart, i * 300);
    }
  </script>
</body>
</html>
