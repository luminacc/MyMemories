<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kotak Hadiah Digital - Luminacc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #dc2626 0%, #f59e0b 50%, #ef4444 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #b91c1c, #d97706);
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .back-btn {
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .back-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    .header-center h1 { font-size: 1.3rem; margin: 0; }
    .header-center p { font-size: 0.75rem; margin: 3px 0 0 0; opacity: 0.85; }

    .main-content {
      padding-top: 80px;
      max-width: 900px;
      margin: 0 auto;
      padding-left: 15px;
      padding-right: 15px;
      padding-bottom: 30px;
    }

    .create-section {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      margin-bottom: 25px;
    }

    .create-section h2 {
      color: #b91c1c;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .gift-types {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .gift-type-btn {
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .gift-type-btn:hover {
      border-color: #f59e0b;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .gift-type-btn.selected {
      border-color: #dc2626;
      background: linear-gradient(135deg, #fef2f2, #fffbeb);
      box-shadow: 0 4px 15px rgba(220,38,38,0.15);
    }

    .gift-type-btn .gift-icon {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .gift-type-btn .gift-label {
      font-size: 0.78rem;
      font-weight: 500;
      color: #333;
    }

    .create-form {
      display: none;
      text-align: left;
    }

    .create-form.active { display: block; }

    .form-field {
      margin-bottom: 14px;
    }

    .form-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
      color: #333;
    }

    .form-field input:focus,
    .form-field textarea:focus { border-color: #f59e0b; }

    .form-field textarea { resize: vertical; min-height: 80px; }

    .send-gift-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #dc2626, #f59e0b);
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .send-gift-btn:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(220,38,38,0.3); }

    .gifts-section h3 {
      color: white;
      font-size: 1.1rem;
      margin-bottom: 15px;
      text-align: center;
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .gift-card {
      background: rgba(255,255,255,0.92);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .gift-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
    }

    .gift-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #dc2626, #f59e0b);
    }

    .gift-card .gift-icon-large {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .gift-card h4 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 4px;
    }

    .gift-card .gift-from {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 8px;
    }

    .gift-card .gift-status {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 10px;
      display: inline-block;
    }

    .status-sealed {
      background: #fef3c7;
      color: #d97706;
    }

    .status-opened {
      background: #d1fae5;
      color: #059669;
    }

    .empty-gifts {
      grid-column: 1 / -1;
      text-align: center;
      color: white;
      opacity: 0.7;
      padding: 30px;
    }

    .empty-gifts i { font-size: 3rem; margin-bottom: 10px; display: block; }

    .gift-open-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .gift-open-overlay.active { display: flex; }

    .gift-box-3d {
      perspective: 800px;
      width: 200px;
      height: 220px;
      margin: 0 auto 20px;
      position: relative;
    }

    .box-base {
      width: 200px;
      height: 140px;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      border-radius: 10px;
      position: absolute;
      bottom: 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box-ribbon-v {
      width: 20px;
      height: 100%;
      background: linear-gradient(180deg, #f59e0b, #d97706);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    .box-ribbon-h {
      width: 100%;
      height: 20px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 3px;
    }

    .box-lid {
      width: 220px;
      height: 50px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 10px 10px 0 0;
      position: absolute;
      top: 0;
      left: -10px;
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 2;
    }

    .box-lid .lid-ribbon {
      width: 20px;
      height: 100%;
      background: linear-gradient(180deg, #f59e0b, #d97706);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    .box-lid .bow {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
    }

    .gift-open-overlay.opening .box-lid {
      transform: rotateX(-110deg);
    }

    .sparkle-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      font-size: 1.5rem;
      animation: sparkleAnim 1.5s ease-out forwards;
    }

    @keyframes sparkleAnim {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg); }
    }

    .gift-content-display {
      display: none;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 30px;
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .gift-content-display .content-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .gift-content-display h2 {
      color: #b91c1c;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .gift-content-display p {
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .gift-content-display .from-label {
      font-size: 0.8rem;
      color: #999;
    }

    .close-overlay-btn {
      margin-top: 15px;
      background: linear-gradient(135deg, #dc2626, #f59e0b);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .close-overlay-btn:hover { transform: scale(1.05); }

    @media (max-width: 768px) {
      header { padding: 10px 15px; }
      .header-center h1 { font-size: 1.1rem; }
      .gift-types { grid-template-columns: repeat(2, 1fr); }
      .gifts-grid { grid-template-columns: 1fr; }
      .gift-box-3d { width: 160px; height: 180px; }
      .box-base { width: 160px; height: 110px; }
      .box-lid { width: 180px; height: 40px; }
    }

    @media (max-width: 480px) {
      .gift-types { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .gift-type-btn { padding: 14px 8px; }
      .gift-type-btn .gift-icon { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Kembali
    </a>
    <div class="header-center">
      <h1>Kotak Hadiah Digital</h1>
      <p>Kirim hadiah virtual untuk pasangan</p>
    </div>
    <div style="width: 80px;"></div>
  </header>

  <div class="main-content">
    <div class="create-section">
      <h2><i class="fas fa-gift" style="margin-right:6px;"></i>Buat Hadiah Baru</h2>

      <div class="gift-types">
        <div class="gift-type-btn" data-type="letter">
          <div class="gift-icon">💌</div>
          <div class="gift-label">Surat Cinta</div>
        </div>
        <div class="gift-type-btn" data-type="collage">
          <div class="gift-icon">🖼️</div>
          <div class="gift-label">Kolase Foto</div>
        </div>
        <div class="gift-type-btn" data-type="coupon">
          <div class="gift-icon">🎟️</div>
          <div class="gift-label">Kupon Cinta</div>
        </div>
        <div class="gift-type-btn" data-type="song">
          <div class="gift-icon">🎵</div>
          <div class="gift-label">Lagu Romantis</div>
        </div>
        <div class="gift-type-btn" data-type="custom">
          <div class="gift-icon">✨</div>
          <div class="gift-label">Custom Gift</div>
        </div>
      </div>

      <div class="create-form" id="createForm">
        <div class="form-field">
          <label>Judul Hadiah</label>
          <input type="text" id="giftTitle" placeholder="Contoh: Surat Cinta Untukmu">
        </div>
        <div class="form-field">
          <label>Pesan / Isi Hadiah</label>
          <textarea id="giftMessage" placeholder="Tuliskan pesan cintamu di sini..."></textarea>
        </div>
        <div class="form-field">
          <label>Kirim Ke</label>
          <input type="text" id="giftTo" placeholder="Nama pasangan">
        </div>
        <button class="send-gift-btn" id="sendGiftBtn">
          <i class="fas fa-paper-plane"></i> Kirim Hadiah
        </button>
      </div>
    </div>

    <div class="gifts-section">
      <h3><i class="fas fa-box-open" style="margin-right:6px;"></i>Hadiah Kiriman</h3>
      <div class="gifts-grid" id="giftsGrid">
        <div class="empty-gifts">
          <i class="fas fa-gift"></i>
          <p>Belum ada hadiah. Buat hadiah pertama!</p>
        </div>
      </div>
    </div>
  </div>

  <div class="gift-open-overlay" id="giftOverlay">
    <div id="giftOverlayContent">
      <div class="gift-box-3d" id="giftBox3d">
        <div class="box-lid" id="boxLid">
          <div class="lid-ribbon"></div>
          <div class="bow">🎀</div>
        </div>
        <div class="box-base">
          <div class="box-ribbon-v"></div>
          <div class="box-ribbon-h"></div>
        </div>
        <div class="sparkle-container" id="sparkles"></div>
      </div>
      <div class="gift-content-display" id="giftContent">
        <div class="content-icon" id="contentIcon"></div>
        <h2 id="contentTitle"></h2>
        <p id="contentMessage"></p>
        <div class="from-label" id="contentFrom"></div>
        <button class="close-overlay-btn" id="closeOverlayBtn">Tutup</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { db } from './js/firebase-config.js';
    import { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const user = await requireAuth();
    if (!user) throw new Error('Not authenticated');

    const giftsRef = collection(db, 'gifts');
    const q = query(giftsRef, orderBy('createdAt', 'desc'));

    const typeIcons = {
      letter: '💌',
      collage: '🖼️',
      coupon: '🎟️',
      song: '🎵',
      custom: '✨'
    };

    const typeLabels = {
      letter: 'Surat Cinta',
      collage: 'Kolase Foto',
      coupon: 'Kupon Cinta',
      song: 'Lagu Romantis',
      custom: 'Custom Gift'
    };

    let selectedType = null;

    document.querySelectorAll('.gift-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.gift-type-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedType = btn.dataset.type;
        document.getElementById('createForm').classList.add('active');
        document.getElementById('giftTitle').placeholder = `Contoh: ${typeLabels[selectedType]}`;
      });
    });

    const giftsGrid = document.getElementById('giftsGrid');

    onSnapshot(q, (snapshot) => {
      giftsGrid.innerHTML = '';
      if (snapshot.empty) {
        giftsGrid.innerHTML = `
          <div class="empty-gifts">
            <i class="fas fa-gift"></i>
            <p>Belum ada hadiah. Buat hadiah pertama!</p>
          </div>`;
        return;
      }

      snapshot.forEach(docSnap => {
        const gift = docSnap.data();
        const card = document.createElement('div');
        card.className = 'gift-card';
        card.dataset.id = docSnap.id;

        const icon = typeIcons[gift.type] || '🎁';
        const statusClass = gift.opened ? 'status-opened' : 'status-sealed';
        const statusText = gift.opened ? 'Dibuka ✓' : 'Belum Dibuka';

        card.innerHTML = `
          <div class="gift-icon-large">${icon}</div>
          <h4>${escapeHtml(gift.title || 'Hadiah')}</h4>
          <div class="gift-from">Dari: ${escapeHtml(gift.from || 'Anonymous')}</div>
          <div class="gift-status ${statusClass}">${statusText}</div>`;

        card.addEventListener('click', () => openGift(docSnap.id, gift));
        giftsGrid.appendChild(card);
      });
    });

    document.getElementById('sendGiftBtn').addEventListener('click', async () => {
      if (!selectedType) { alert('Pilih tipe hadiah terlebih dahulu!'); return; }

      const title = document.getElementById('giftTitle').value.trim();
      const message = document.getElementById('giftMessage').value.trim();
      const to = document.getElementById('giftTo').value.trim();

      if (!title || !message) { alert('Judul dan pesan harus diisi!'); return; }

      const btn = document.getElementById('sendGiftBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';

      try {
        await addDoc(giftsRef, {
          type: selectedType,
          title,
          message,
          from: user.displayName || user.email,
          to: to || 'Pasangan',
          createdAt: serverTimestamp(),
          opened: false
        });

        document.getElementById('giftTitle').value = '';
        document.getElementById('giftMessage').value = '';
        document.getElementById('giftTo').value = '';
        document.getElementById('createForm').classList.remove('active');
        document.querySelectorAll('.gift-type-btn').forEach(b => b.classList.remove('selected'));
        selectedType = null;
      } catch (e) {
        alert('Gagal mengirim hadiah: ' + e.message);
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Hadiah';
    });

    const giftOverlay = document.getElementById('giftOverlay');
    const giftBox3d = document.getElementById('giftBox3d');
    const giftContent = document.getElementById('giftContent');
    const sparkles = document.getElementById('sparkles');
    const closeOverlayBtn = document.getElementById('closeOverlayBtn');

    function openGift(id, gift) {
      giftOverlay.classList.add('active');
      giftOverlay.classList.remove('opening');
      giftBox3d.style.display = 'block';
      giftContent.style.display = 'none';
      sparkles.innerHTML = '';

      setTimeout(() => {
        giftOverlay.classList.add('opening');
        createSparkles();

        setTimeout(() => {
          giftBox3d.style.display = 'none';
          giftContent.style.display = 'block';

          document.getElementById('contentIcon').textContent = typeIcons[gift.type] || '🎁';
          document.getElementById('contentTitle').textContent = gift.title || 'Hadiah';
          document.getElementById('contentMessage').textContent = gift.message || '';
          document.getElementById('contentFrom').textContent = `Dari: ${gift.from || 'Anonymous'}`;

          if (!gift.opened) {
            const giftDoc = doc(db, 'gifts', id);
            updateDoc(giftDoc, { opened: true }).catch(e => console.error(e));
          }
        }, 1200);
      }, 300);
    }

    function createSparkles() {
      const emojis = ['✨', '⭐', '🌟', '💫', '🎉', '🎊'];
      for (let i = 0; i < 20; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = '50%';
        s.style.top = '40%';
        s.style.setProperty('--tx', (Math.random() * 300 - 150) + 'px');
        s.style.setProperty('--ty', (Math.random() * -200 - 50) + 'px');
        s.style.animationDelay = (Math.random() * 0.5) + 's';
        sparkles.appendChild(s);
      }
    }

    closeOverlayBtn.addEventListener('click', () => {
      giftOverlay.classList.remove('active', 'opening');
    });

    giftOverlay.addEventListener('click', (e) => {
      if (e.target === giftOverlay) {
        giftOverlay.classList.remove('active', 'opening');
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
