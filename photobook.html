<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Kenangan - Luminacc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fdf6ec 0%, #f5e6d3 50%, #efe1cc 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, #8d6e47, #a0845e, #b89b6a);
      color: white;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    header h1 {
      font-family: 'Dancing Script', cursive;
      margin: 0;
      font-size: 2rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 15px;
      transition: background 0.3s;
    }

    .back-btn:hover { background: rgba(255,255,255,0.45); }

    .music-toggle {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-toggle:hover { background: rgba(255,255,255,0.45); }

    .book-container {
      max-width: 900px;
      margin: 110px auto 30px;
      padding: 20px;
      perspective: 1200px;
    }

    .book {
      position: relative;
      width: 100%;
      min-height: 520px;
    }

    .book-page {
      display: none;
      width: 100%;
      gap: 20px;
      opacity: 0;
      transform: rotateY(-90deg);
      transition: transform 0.5s ease, opacity 0.4s ease;
    }

    .book-page.active {
      display: flex;
      opacity: 1;
      transform: rotateY(0deg);
      animation: pageFlipIn 0.6s ease;
    }

    @keyframes pageFlipIn {
      0% { transform: rotateY(-40deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }

    @keyframes pageFlipOut {
      0% { transform: rotateY(0deg); opacity: 1; }
      100% { transform: rotateY(40deg); opacity: 0; }
    }

    .photo-side {
      flex: 1;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.1),
        inset 0 0 40px rgba(139,109,71,0.05);
      display: flex;
      flex-direction: column;
    }

    .photo-side img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      padding: 14px 16px;
      text-align: center;
      color: #6d4c41;
      font-style: italic;
      font-size: 0.85rem;
      background: linear-gradient(to bottom, #fdf6ec, #f5e6d3);
      border-top: 1px solid #e8d5bf;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .book-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 25px;
    }

    .nav-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #a0845e;
      background: white;
      color: #8d6e47;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .nav-btn:hover:not(:disabled) {
      background: #8d6e47;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(141,110,71,0.3);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.95rem;
      color: #8d6e47;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #8d6e47;
    }

    .loading i {
      font-size: 3rem;
      margin-bottom: 15px;
      animation: spin 1.5s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8d6e47;
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.4;
    }

    .photo-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(141,110,71,0.85);
      color: white;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 2;
    }

    .photo-side { position: relative; }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 14px; }
      header h1 { font-size: 1.5rem; }
      header p { font-size: 0.75rem; }
      .back-btn { padding: 6px 12px; font-size: 13px; }
      .book-container { margin: 95px auto 20px; padding: 15px; }
      .book-page { flex-direction: column; gap: 15px; }
      .photo-side img { height: 280px; }
      .book { min-height: auto; }
      .music-toggle { width: 34px; height: 34px; font-size: 14px; }
    }

    @media (max-width: 576px) {
      header h1 { font-size: 1.3rem; }
      .photo-side img { height: 240px; }
      .nav-btn { width: 44px; height: 44px; font-size: 1rem; }
      .photo-caption { font-size: 0.8rem; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    <h1>Buku Kenangan</h1>
    <p>Momennya kita tersimpan di sini</p>
    <button class="music-toggle" id="musicToggle" title="Toggle Musik">
      <i class="fas fa-music"></i>
    </button>
  </header>

  <div class="book-container">
    <div class="book" id="book">
      <div class="loading" id="loadingState">
        <i class="fas fa-book-open"></i>
        <p>Menyiapkan buku kenangan...</p>
      </div>
    </div>

    <div class="book-nav" id="bookNav" style="display:none;">
      <button class="nav-btn" id="prevBtn" disabled>
        <i class="fas fa-chevron-left"></i>
      </button>
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button class="nav-btn" id="nextBtn" disabled>
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="audio/losingus.mp3" type="audio/mpeg" />
  </audio>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    const book = document.getElementById('book');
    const loadingState = document.getElementById('loadingState');
    const bookNav = document.getElementById('bookNav');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');

    let allPhotos = [];
    let currentPage = 0;
    let totalPages = 0;

    bgMusic.volume = 0.3;

    musicToggle.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
        musicToggle.innerHTML = '<i class="fas fa-volume-up"></i>';
      } else {
        bgMusic.pause();
        musicToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
      }
    });

    const userInteracted = () => {
      bgMusic.play().then(() => {
        musicToggle.innerHTML = '<i class="fas fa-volume-up"></i>';
      }).catch(() => {});
      document.removeEventListener('click', userInteracted);
      document.removeEventListener('touchstart', userInteracted);
    };
    document.addEventListener('click', userInteracted);
    document.addEventListener('touchstart', userInteracted);

    async function loadPhotos() {
      const maxPhotos = 50;
      const photos = [];

      for (let i = 1; i <= maxPhotos; i++) {
        const num = String(i).padStart(3, '0');
        photos.push(`img/set1/${num}.jpg`);
      }

      const loaded = [];
      const loadPromises = photos.map((src) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { loaded.push(src); resolve(); };
          img.onerror = () => resolve();
          img.src = src;
        });
      });

      await Promise.all(loadPromises);
      loaded.sort();
      allPhotos = loaded;

      if (allPhotos.length === 0) {
        loadingState.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-images"></i>
            <p>Belum ada foto ditemukan</p>
          </div>`;
        return;
      }

      loadingState.style.display = 'none';
      totalPages = Math.ceil(allPhotos.length / 2);
      buildBook();
      showPage(0);
      bookNav.style.display = 'flex';
    }

    function buildBook() {
      book.innerHTML = '';
      for (let p = 0; p < totalPages; p++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'book-page';
        pageDiv.dataset.page = p;

        const leftIdx = p * 2;
        const rightIdx = p * 2 + 1;

        const leftSide = createPhotoSide(allPhotos[leftIdx], leftIdx + 1, p);
        pageDiv.appendChild(leftSide);

        if (rightIdx < allPhotos.length) {
          const rightSide = createPhotoSide(allPhotos[rightIdx], rightIdx + 1, p);
          pageDiv.appendChild(rightSide);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'photo-side';
          placeholder.style.background = 'linear-gradient(135deg, #fdf6ec, #f5e6d3)';
          placeholder.style.display = 'flex';
          placeholder.style.alignItems = 'center';
          placeholder.style.justifyContent = 'center';
          placeholder.style.minHeight = '406px';
          placeholder.innerHTML = '<i class="fas fa-heart" style="font-size:3rem; color:#d7ccc8; opacity:0.5;"></i>';
          pageDiv.appendChild(placeholder);
        }

        book.appendChild(pageDiv);
      }
    }

    function createPhotoSide(src, number, pageIndex) {
      const side = document.createElement('div');
      side.className = 'photo-side';

      const badge = document.createElement('div');
      badge.className = 'photo-badge';
      badge.textContent = `#${number}`;

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Foto Kenangan #${number}`;
      img.loading = 'lazy';

      const caption = document.createElement('div');
      caption.className = 'photo-caption';
      caption.textContent = `Kenangan indah kita #${number} ❤`;

      side.appendChild(badge);
      side.appendChild(img);
      side.appendChild(caption);
      return side;
    }

    function showPage(index) {
      document.querySelectorAll('.book-page').forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none';
      });

      const target = book.querySelector(`[data-page="${index}"]`);
      if (target) {
        target.style.display = 'flex';
        requestAnimationFrame(() => {
          target.classList.add('active');
        });
      }

      currentPage = index;
      pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === totalPages - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) showPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages - 1) showPage(currentPage + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentPage > 0) showPage(currentPage - 1);
      if (e.key === 'ArrowRight' && currentPage < totalPages - 1) showPage(currentPage + 1);
    });

    let touchStartX = 0;
    book.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
    book.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0 && currentPage < totalPages - 1) showPage(currentPage + 1);
        else if (diff < 0 && currentPage > 0) showPage(currentPage - 1);
      }
    });

    loadPhotos();
  </script>
</body>
</html>
