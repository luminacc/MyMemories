<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jurnal Cinta - Luminacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #2c1810 0%, #3d2317 25%, #4a2c1a 50%, #3a2015 75%, #1f100a 100%);
      font-family: 'Poppins', sans-serif;
      color: #f5e6d3;
      min-height: 100vh;
      padding-top: 130px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 20px 20px 18px;
      background: linear-gradient(135deg, #2c1810 0%, #3d2317 50%, #3a2015 100%);
      color: white;
      z-index: 1000;
      box-shadow: 0 4px 25px rgba(60, 30, 10, 0.5);
      border-bottom: 1px solid rgba(139, 90, 43, 0.3);
    }

    header h1 {
      margin: 0;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      background: linear-gradient(135deg, #f5deb3, #daa520, #cd853f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.85rem;
      color: #d2b48c;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(139, 90, 43, 0.2);
      border: 1px solid rgba(139, 90, 43, 0.4);
      color: #d2b48c;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s;
      backdrop-filter: blur(5px);
    }

    .back-btn:hover {
      background: rgba(139, 90, 43, 0.4);
      color: #fff;
      transform: translateY(-50%) scale(1.05);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-bar input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid rgba(139, 90, 43, 0.3);
      border-radius: 12px;
      background: rgba(30, 18, 10, 0.7);
      color: #f5e6d3;
      font-size: 0.9rem;
      transition: border-color 0.3s;
      backdrop-filter: blur(5px);
    }

    .search-bar input:focus {
      outline: none;
      border-color: #daa520;
      box-shadow: 0 0 12px rgba(218, 165, 32, 0.2);
    }

    .search-bar input::placeholder {
      color: rgba(210, 180, 140, 0.5);
    }

    .search-bar select {
      padding: 14px 18px;
      border: 1px solid rgba(139, 90, 43, 0.3);
      border-radius: 12px;
      background: rgba(30, 18, 10, 0.7);
      color: #f5e6d3;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .search-bar select:focus {
      outline: none;
      border-color: #daa520;
    }

    .add-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #8b5a2b, #daa520);
      color: #1f100a;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.3s;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .add-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(139, 90, 43, 0.4);
    }

    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .journal-entry {
      background: linear-gradient(135deg, rgba(44, 24, 16, 0.8), rgba(61, 35, 23, 0.8));
      border: 1px solid rgba(139, 90, 43, 0.25);
      border-radius: 16px;
      padding: 0;
      backdrop-filter: blur(8px);
      overflow: hidden;
      transition: all 0.3s;
      animation: entryIn 0.4s ease-out;
    }

    .journal-entry:hover {
      transform: translateY(-3px);
      border-color: rgba(218, 165, 32, 0.4);
      box-shadow: 0 8px 30px rgba(60, 30, 10, 0.4);
    }

    @keyframes entryIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .entry-header {
      padding: 18px 22px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(139, 90, 43, 0.15);
    }

    .entry-date {
      font-size: 0.75rem;
      color: #b8860b;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .entry-mood {
      font-size: 1.5rem;
    }

    .entry-body {
      padding: 16px 22px;
    }

    .entry-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #f5deb3;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .entry-content {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #d2b48c;
      white-space: pre-line;
    }

    .entry-footer {
      padding: 10px 22px 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid rgba(139, 90, 43, 0.15);
    }

    .entry-footer button {
      background: rgba(139, 90, 43, 0.2);
      border: 1px solid rgba(139, 90, 43, 0.3);
      color: #d2b48c;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.3s;
    }

    .entry-footer button:hover {
      background: rgba(139, 90, 43, 0.4);
      color: #fff;
    }

    .entry-footer button.delete-btn:hover {
      background: rgba(180, 50, 50, 0.5);
      border-color: rgba(180, 50, 50, 0.5);
    }

    .private-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(139, 90, 43, 0.25);
      color: #b8860b;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(210, 180, 140, 0.5);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 16px;
      display: block;
      color: rgba(139, 90, 43, 0.3);
    }

    .empty-state p {
      font-size: 1rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 8, 3, 0.85);
      z-index: 2000;
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 80px;
    }

    .modal-content {
      background: linear-gradient(135deg, #3d2317, #2c1810);
      border: 1px solid rgba(139, 90, 43, 0.3);
      border-radius: 18px;
      padding: 28px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: #b8860b;
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.3s;
    }

    .modal-close:hover {
      color: #daa520;
    }

    .modal-content h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #f5deb3;
      margin-bottom: 20px;
    }

    .modal-content .form-group {
      margin-bottom: 16px;
    }

    .modal-content label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #d2b48c;
      font-weight: 500;
    }

    .modal-content input[type="text"],
    .modal-content textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(139, 90, 43, 0.3);
      border-radius: 10px;
      background: rgba(20, 12, 6, 0.8);
      color: #f5e6d3;
      font-size: 0.9rem;
      transition: border-color 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .modal-content input[type="text"]:focus,
    .modal-content textarea:focus {
      outline: none;
      border-color: #daa520;
      box-shadow: 0 0 12px rgba(218, 165, 32, 0.2);
    }

    .modal-content textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.7;
    }

    .mood-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mood-option {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(139, 90, 43, 0.3);
      border-radius: 10px;
      background: rgba(30, 18, 10, 0.6);
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .mood-option:hover {
      border-color: rgba(218, 165, 32, 0.5);
      transform: scale(1.1);
    }

    .mood-option.selected {
      border-color: #daa520;
      background: rgba(218, 165, 32, 0.15);
      box-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
    }

    .private-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .private-toggle input[type="checkbox"] {
      display: none;
    }

    .toggle-track {
      width: 44px;
      height: 24px;
      background: rgba(139, 90, 43, 0.3);
      border-radius: 12px;
      position: relative;
      transition: background 0.3s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: #d2b48c;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: all 0.3s;
    }

    .private-toggle input:checked + .toggle-track {
      background: rgba(218, 165, 32, 0.5);
    }

    .private-toggle input:checked + .toggle-track::after {
      left: 23px;
      background: #f5deb3;
    }

    .private-toggle span {
      font-size: 0.85rem;
      color: #d2b48c;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5a2b, #daa520);
      color: #1f100a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 90, 43, 0.4);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #8b5a2b, #daa520);
      color: #1f100a;
      padding: 14px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(139, 90, 43, 0.4);
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.3s ease, opacity 0.3s;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 110px; }
      header { padding: 15px; }
      header h1 { font-size: 1.6rem; }
      header p { font-size: 0.8rem; }
      .back-btn { padding: 6px 12px; font-size: 13px; }
      .container { padding: 15px; }
      .search-bar { flex-direction: column; }
      .entry-title { font-size: 1.1rem; }
      .entry-content { font-size: 0.85rem; }
      .modal-overlay.active { padding-top: 60px; }
      .modal-content { padding: 20px; }
    }

    @media screen and (max-width: 576px) {
      body { padding-top: 100px; }
      header h1 { font-size: 1.4rem; }
      .mood-option { width: 38px; height: 38px; font-size: 1.1rem; }
      .add-btn { font-size: 0.9rem; padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    <h1><i class="fas fa-book-heart"></i> Jurnal Cinta</h1>
    <p>Tuliskan kisah cinta kita</p>
  </header>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Cari entri jurnal...">
      <select id="moodFilter">
        <option value="all">Semua Mood</option>
        <option value="😍">😍 Cinta</option>
        <option value="🥰">🥰 Sayang</option>
        <option value="😊">😊 Bahagia</option>
        <option value="🥲">�asa Haru</option>
        <option value="😢">😢 Sedih</option>
        <option value="🤗">🤗 Rindu</option>
        <option value="😍">😍 Kagum</option>
        <option value="✨">✨ Bersemangat</option>
      </select>
    </div>

    <button class="add-btn" id="addEntryBtn">
      <i class="fas fa-feather-pointed"></i> Tulis Jurnal Baru
    </button>

    <div class="entries-list" id="entriesList"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <i class="fas fa-book-open"></i>
      <p>Belum ada entri jurnal. Mulai tulis kisah cinta kalian!</p>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="modalTitle">Tulis Jurnal Baru</h2>
      <form id="journalForm">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label for="entryTitle">Judul</label>
          <input type="text" id="entryTitle" placeholder="Judul entri..." required>
        </div>
        <div class="form-group">
          <label for="entryContent">Cerita</label>
          <textarea id="entryContent" placeholder="Tuliskan kisah kalian hari ini..." required></textarea>
        </div>
        <div class="form-group">
          <label>Mood Hari Ini</label>
          <div class="mood-selector" id="moodSelector">
            <div class="mood-option selected" data-mood="😍">😍</div>
            <div class="mood-option" data-mood="🥰">🥰</div>
            <div class="mood-option" data-mood="😊">😊</div>
            <div class="mood-option" data-mood="🥲">🥲</div>
            <div class="mood-option" data-mood="😢">😢</div>
            <div class="mood-option" data-mood="🤗">🤗</div>
            <div class="mood-option" data-mood="🤩">🤩</div>
            <div class="mood-option" data-mood="✨">✨</div>
          </div>
        </div>
        <div class="form-group">
          <label class="private-toggle">
            <input type="checkbox" id="isPrivate" checked>
            <div class="toggle-track"></div>
            <span>Entri privat (hanya terlihat oleh kita)</span>
          </label>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-save"></i> Simpan Jurnal
        </button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    import { db } from './js/firebase-config.js';
    import {
      collection,
      addDoc,
      updateDoc,
      onSnapshot,
      query,
      orderBy,
      doc,
      deleteDoc,
      Timestamp,
      where
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const entriesList = document.getElementById('entriesList');
    const emptyState = document.getElementById('emptyState');
    const addEntryBtn = document.getElementById('addEntryBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalTitle = document.getElementById('modalTitle');
    const journalForm = document.getElementById('journalForm');
    const editId = document.getElementById('editId');
    const entryTitle = document.getElementById('entryTitle');
    const entryContent = document.getElementById('entryContent');
    const isPrivate = document.getElementById('isPrivate');
    const submitBtn = document.getElementById('submitBtn');
    const moodSelector = document.getElementById('moodSelector');
    const searchInput = document.getElementById('searchInput');
    const moodFilter = document.getElementById('moodFilter');
    const toast = document.getElementById('toast');

    let selectedMood = '😍';
    let allEntries = [];

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function formatDate(dateValue) {
      const d = dateValue?.toDate ? dateValue.toDate() : new Date(dateValue);
      return d.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    // Mood selector
    moodSelector.addEventListener('click', (e) => {
      const option = e.target.closest('.mood-option');
      if (!option) return;
      moodSelector.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
      option.classList.add('selected');
      selectedMood = option.dataset.mood;
    });

    // Modal
    addEntryBtn.addEventListener('click', () => {
      editId.value = '';
      journalForm.reset();
      modalTitle.textContent = 'Tulis Jurnal Baru';
      submitBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Jurnal';
      isPrivate.checked = true;
      moodSelector.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
      moodSelector.querySelector('[data-mood="😍"]').classList.add('selected');
      selectedMood = '😍';
      modalOverlay.classList.add('active');
    });

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // Search & filter
    function filterEntries() {
      const searchTerm = searchInput.value.toLowerCase();
      const moodVal = moodFilter.value;

      let filtered = allEntries;

      if (searchTerm) {
        filtered = filtered.filter(e =>
          e.title.toLowerCase().includes(searchTerm) ||
          e.content.toLowerCase().includes(searchTerm)
        );
      }

      if (moodVal !== 'all') {
        filtered = filtered.filter(e => e.mood === moodVal);
      }

      renderEntriesFromList(filtered);
    }

    searchInput.addEventListener('input', filterEntries);
    moodFilter.addEventListener('change', filterEntries);

    function renderEntriesFromList(entries) {
      entriesList.innerHTML = '';

      if (entries.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      entries.forEach(entry => {
        const el = createEntryElement(entry);
        entriesList.appendChild(el);
      });
    }

    function createEntryElement(data) {
      const el = document.createElement('div');
      el.className = 'journal-entry';
      el.dataset.id = data.id;

      el.innerHTML = `
        <div class="entry-header">
          <div>
            <div class="entry-date">${formatDate(data.date)}</div>
            ${data.isPrivate ? '<div class="private-badge"><i class="fas fa-lock"></i> Privat</div>' : ''}
          </div>
          <div class="entry-mood">${data.mood}</div>
        </div>
        <div class="entry-body">
          <div class="entry-title">${data.title}</div>
          <div class="entry-content">${data.content}</div>
        </div>
        <div class="entry-footer">
          <button class="edit-btn"><i class="fas fa-pen"></i> Edit</button>
          <button class="delete-btn"><i class="fas fa-trash"></i> Hapus</button>
        </div>
      `;

      el.querySelector('.edit-btn').addEventListener('click', () => openEditModal(data));
      el.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm('Hapus entri jurnal ini?')) {
          await deleteDoc(doc(db, 'loveJournals', data.id));
          showToast('Entri dihapus');
        }
      });

      return el;
    }

    function openEditModal(data) {
      editId.value = data.id;
      entryTitle.value = data.title;
      entryContent.value = data.content;
      isPrivate.checked = data.isPrivate;
      modalTitle.textContent = 'Edit Jurnal';
      submitBtn.innerHTML = '<i class="fas fa-save"></i> Perbarui Jurnal';

      moodSelector.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
      const target = moodSelector.querySelector(`[data-mood="${data.mood}"]`);
      if (target) {
        target.classList.add('selected');
        selectedMood = data.mood;
      }

      modalOverlay.classList.add('active');
    }

    // Form submit
    journalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = entryTitle.value.trim();
      const content = entryContent.value.trim();
      if (!title || !content) return;

      const editIdVal = editId.value;

      if (editIdVal) {
        await updateDoc(doc(db, 'loveJournals', editIdVal), {
          title,
          content,
          mood: selectedMood,
          isPrivate: isPrivate.checked
        });
        showToast('Jurnal diperbarui!');
      } else {
        await addDoc(collection(db, 'loveJournals'), {
          title,
          content,
          mood: selectedMood,
          date: Timestamp.now(),
          isPrivate: isPrivate.checked
        });
        showToast('Jurnal tersimpan!');
      }

      modalOverlay.classList.remove('active');
      journalForm.reset();
    });

    // Load entries
    const q = query(collection(db, 'loveJournals'), orderBy('date', 'desc'));
    onSnapshot(q, (snapshot) => {
      allEntries = [];
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        data.id = docSnap.id;
        allEntries.push(data);
      });
      filterEntries();
    });
  </script>
</body>
</html>
