<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romantic Night Planner - Luminacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #2d0a0a 0%, #4a0e0e 25%, #5c1212 50%, #3d0c0c 75%, #1f0505 100%);
      font-family: 'Poppins', sans-serif;
      color: #fde8e8;
      min-height: 100vh;
      padding-top: 130px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 20px 20px 18px;
      background: linear-gradient(135deg, #2d0a0a 0%, #4a0e0e 50%, #3d0c0c 100%);
      color: white;
      z-index: 1000;
      box-shadow: 0 4px 25px rgba(180, 30, 30, 0.3);
      border-bottom: 1px solid rgba(220, 60, 60, 0.3);
    }

    header h1 {
      margin: 0;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      background: linear-gradient(135deg, #fbbf24, #f97316, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.85rem;
      color: #fca5a5;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(220, 60, 60, 0.2);
      border: 1px solid rgba(220, 60, 60, 0.4);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s;
      backdrop-filter: blur(5px);
    }

    .back-btn:hover {
      background: rgba(220, 60, 60, 0.4);
      color: #fff;
      transform: translateY(-50%) scale(1.05);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .progress-section {
      background: rgba(40, 10, 10, 0.7);
      border: 1px solid rgba(220, 60, 60, 0.25);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 25px;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .progress-section h2 {
      font-size: 1rem;
      color: #fbbf24;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .progress-bar-container {
      background: rgba(100, 20, 20, 0.5);
      border-radius: 20px;
      height: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(220, 60, 60, 0.2);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f97316, #fbbf24);
      border-radius: 20px;
      transition: width 0.5s ease;
      position: relative;
      min-width: 0;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-text {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #fca5a5;
      font-weight: 600;
    }

    .candle-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .candle {
      font-size: 1.5rem;
      animation: flicker 1.5s infinite alternate;
    }

    .candle:nth-child(2) { animation-delay: 0.3s; }
    .candle:nth-child(3) { animation-delay: 0.6s; }
    .candle:nth-child(4) { animation-delay: 0.9s; }
    .candle:nth-child(5) { animation-delay: 1.2s; }

    @keyframes flicker {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.8; transform: scale(0.95); }
    }

    .activities-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .activity-item {
      background: rgba(40, 10, 10, 0.6);
      border: 1px solid rgba(220, 60, 60, 0.2);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(5px);
      position: relative;
      overflow: hidden;
    }

    .activity-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #ef4444, #f97316);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .activity-item:hover {
      border-color: rgba(220, 60, 60, 0.4);
      transform: translateX(4px);
    }

    .activity-item:hover::before {
      opacity: 1;
    }

    .activity-item.checked {
      background: rgba(60, 20, 20, 0.8);
      border-color: rgba(251, 191, 36, 0.4);
    }

    .activity-item.checked::before {
      opacity: 1;
      background: linear-gradient(180deg, #fbbf24, #f97316);
    }

    .activity-check {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(220, 60, 60, 0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.3s;
      flex-shrink: 0;
      background: rgba(30, 8, 8, 0.5);
    }

    .activity-item.checked .activity-check {
      background: linear-gradient(135deg, #fbbf24, #f97316);
      border-color: #fbbf24;
      color: #2d0a0a;
    }

    .activity-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .activity-info {
      flex: 1;
    }

    .activity-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fde8e8;
      transition: color 0.3s;
    }

    .activity-item.checked .activity-name {
      color: #fbbf24;
    }

    .activity-desc {
      font-size: 0.78rem;
      color: #fca5a5;
      margin-top: 2px;
    }

    .activity-delete {
      background: none;
      border: none;
      color: rgba(252, 165, 165, 0.3);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.3s;
      opacity: 0;
    }

    .activity-item:hover .activity-delete {
      opacity: 1;
    }

    .activity-delete:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .add-section {
      background: rgba(40, 10, 10, 0.6);
      border: 1px solid rgba(220, 60, 60, 0.25);
      border-radius: 16px;
      padding: 22px;
      margin-top: 25px;
      backdrop-filter: blur(10px);
    }

    .add-section h3 {
      font-size: 0.95rem;
      color: #fbbf24;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-form {
      display: flex;
      gap: 10px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(220, 60, 60, 0.3);
      border-radius: 10px;
      background: rgba(30, 8, 8, 0.8);
      color: #fde8e8;
      font-size: 0.9rem;
      transition: border-color 0.3s;
    }

    .add-form input:focus {
      outline: none;
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    .add-form input::placeholder {
      color: rgba(220, 60, 60, 0.5);
    }

    .add-form button {
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .add-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.3s ease, opacity 0.3s;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 110px; }
      header { padding: 15px; }
      header h1 { font-size: 1.6rem; }
      header p { font-size: 0.8rem; }
      .back-btn { padding: 6px 12px; font-size: 13px; }
      .container { padding: 15px; }
      .add-form { flex-direction: column; }
      .add-form button { width: 100%; }
    }

    @media screen and (max-width: 576px) {
      body { padding-top: 100px; }
      header h1 { font-size: 1.4rem; }
      .activity-item { padding: 12px 14px; gap: 10px; }
      .activity-icon { font-size: 1.3rem; }
      .activity-name { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    <h1><i class="fas fa-heart"></i> Romantic Night Planner</h1>
    <p>Rencanakan malam spesial kita</p>
  </header>

  <div class="container">
    <div class="progress-section">
      <h2><i class="fas fa-fire"></i> Progress Malam Ini</h2>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progressText">0 dari 0 aktivitas selesai</div>
      <div class="candle-container">
        <span class="candle">🕯️</span>
        <span class="candle">🕯️</span>
        <span class="candle">🕯️</span>
        <span class="candle">🕯️</span>
        <span class="candle">🕯️</span>
      </div>
    </div>

    <div class="activities-list" id="activitiesList"></div>

    <div class="add-section">
      <h3><i class="fas fa-plus-circle"></i> Tambah Aktivitas Custom</h3>
      <form class="add-form" id="addForm">
        <input type="text" id="customActivity" placeholder="Nama aktivitas romantis..." required>
        <button type="submit"><i class="fas fa-plus"></i> Tambah</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { db } from './js/firebase-config.js';
    import {
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      doc,
      setDoc,
      deleteDoc,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const user = await requireAuth();
    if (!user) throw new Error('Not authenticated');

    const defaultActivities = [
      { name: 'Lilin & lampu redup', icon: '🕯️', desc: 'Ciptakan suasana hangat dan intim' },
      { name: 'Musik romantis', icon: '🎵', desc: 'Putar lagu-lagu favorit kita' },
      { name: 'Makan malam spesial', icon: '🍷', desc: 'Masak atau pesan makanan favorit' },
      { name: 'Pijat / massage', icon: '💆', desc: 'Saling memijat untuk relaksasi' },
      { name: 'Nonton film romantis', icon: '🎬', desc: 'Pilih film favorit berdua' },
      { name: 'Hot chocolate / wine', icon: '☕', desc: 'Minuman hangat untuk malam yang nyaman' },
      { name: 'Surat cinta tangan', icon: '💌', desc: 'Tuliskan perasaanmu di kertas' },
      { name: 'Dance berdua', icon: '💃', desc: 'Berjogetlah mengikuti irama' },
      { name: 'Foto bareng', icon: '📸', desc: 'Abadikan momen spesial malam ini' },
      { name: 'Pemandian air hangat', icon: '🛁', desc: 'Bersantai di bak mandi air hangat' }
    ];

    const activitiesList = document.getElementById('activitiesList');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const addForm = document.getElementById('addForm');
    const customActivity = document.getElementById('customActivity');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function updateProgress() {
      const items = activitiesList.querySelectorAll('.activity-item');
      const total = items.length;
      let checked = 0;
      items.forEach(item => {
        if (item.classList.contains('checked')) checked++;
      });
      const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
      progressBar.style.width = pct + '%';
      progressText.textContent = `${checked} dari ${total} aktivitas selesai`;
    }

    function createActivityElement(data, docId) {
      const item = document.createElement('div');
      item.className = `activity-item${data.checked ? ' checked' : ''}`;
      item.dataset.id = docId;

      item.innerHTML = `
        <div class="activity-check">${data.checked ? '<i class="fas fa-check"></i>' : ''}</div>
        <div class="activity-icon">${data.icon || '✨'}</div>
        <div class="activity-info">
          <div class="activity-name">${data.name}</div>
          ${data.desc ? `<div class="activity-desc">${data.desc}</div>` : ''}
        </div>
        ${data.custom ? '<button class="activity-delete" title="Hapus"><i class="fas fa-trash"></i></button>' : ''}
      `;

      item.addEventListener('click', async (e) => {
        if (e.target.closest('.activity-delete')) return;
        const isChecked = item.classList.toggle('checked');
        const checkEl = item.querySelector('.activity-check');
        checkEl.innerHTML = isChecked ? '<i class="fas fa-check"></i>' : '';
        updateProgress();

        try {
          await setDoc(doc(db, 'nightPlans', docId), { checked: isChecked }, { merge: true });
        } catch (err) {
          console.error('Error updating:', err);
        }
      });

      const delBtn = item.querySelector('.activity-delete');
      if (delBtn) {
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (confirm('Hapus aktivitas ini?')) {
            await deleteDoc(doc(db, 'nightPlans', docId));
            showToast('Aktivitas dihapus');
          }
        });
      }

      return item;
    }

    function renderActivities(snapshot) {
      activitiesList.innerHTML = '';

      const defaultDocs = [];
      const customDocs = [];

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        data.id = docSnap.id;
        if (data.custom) {
          customDocs.push(data);
        } else {
          defaultDocs.push(data);
        }
      });

      defaultDocs.forEach(data => {
        const el = createActivityElement(data, data.id);
        activitiesList.appendChild(el);
      });

      customDocs.forEach(data => {
        const el = createActivityElement(data, data.id);
        activitiesList.appendChild(el);
      });

      updateProgress();
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = customActivity.value.trim();
      if (!name) return;

      await addDoc(collection(db, 'nightPlans'), {
        name,
        icon: '✨',
        desc: '',
        custom: true,
        checked: false,
        createdAt: Timestamp.now()
      });

      customActivity.value = '';
      showToast('Aktivitas ditambahkan!');
    });

    async function seedDefaultActivities() {
      const existingQuery = query(collection(db, 'nightPlans'));
      const existingSnapshot = await new Promise(resolve => {
        const unsub = onSnapshot(existingQuery, snap => {
          unsub();
          resolve(snap);
        });
      });

      if (existingSnapshot.empty) {
        for (const act of defaultActivities) {
          await addDoc(collection(db, 'nightPlans'), {
            ...act,
            custom: false,
            checked: false,
            createdAt: Timestamp.now()
          });
        }
      }
    }

    seedDefaultActivities().then(() => {
      const q = query(collection(db, 'nightPlans'), orderBy('createdAt', 'asc'));
      onSnapshot(q, renderActivities);
    });
  </script>
</body>
</html>
