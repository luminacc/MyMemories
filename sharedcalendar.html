<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Bersama - Luminacc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #5a67d8, #6c5ce7);
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .back-btn {
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .back-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    .header-center h1 { font-size: 1.3rem; margin: 0; }
    .header-center p { font-size: 0.75rem; margin: 3px 0 0 0; opacity: 0.85; }

    .main-content {
      padding-top: 80px;
      max-width: 900px;
      margin: 0 auto;
      padding-left: 15px;
      padding-right: 15px;
      padding-bottom: 30px;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      color: white;
    }

    .calendar-nav button {
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-nav button:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }

    .calendar-nav h2 { font-size: 1.3rem; font-weight: 600; min-width: 200px; text-align: center; }

    .calendar-grid {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .cal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 8px;
    }

    .cal-header span {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #5a67d8;
      padding: 8px 0;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .cal-day {
      min-height: 70px;
      border-radius: 10px;
      padding: 5px;
      background: #f8f9ff;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .cal-day:hover { background: #eef0ff; transform: scale(1.02); }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.empty:hover { transform: none; }

    .cal-day .day-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 3px;
    }

    .cal-day.today {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .cal-day.today .day-num { color: white; }

    .day-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-event {
      font-size: 0.6rem;
      padding: 2px 5px;
      border-radius: 4px;
      color: white;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-event.romantic { background: #ff6b81; }
    .day-event.important { background: #667eea; }
    .day-event.fun { background: #48b1bf; }

    .event-legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: white;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .add-event-btn {
      display: block;
      margin: 20px auto 0;
      background: rgba(255,255,255,0.25);
      border: 2px dashed rgba(255,255,255,0.5);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
    }

    .add-event-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.03); }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      animation: modalIn 0.3s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h2 {
      color: #5a67d8;
      margin-bottom: 20px;
      font-size: 1.3rem;
      text-align: center;
    }

    .modal-field {
      margin-bottom: 15px;
    }

    .modal-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }

    .modal-field input,
    .modal-field select,
    .modal-field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
      color: #333;
    }

    .modal-field input:focus,
    .modal-field select:focus,
    .modal-field textarea:focus {
      border-color: #667eea;
    }

    .modal-field textarea { resize: vertical; min-height: 60px; }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-btns button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-save {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-save:hover { transform: scale(1.02); }

    .btn-cancel {
      background: #f0f0f0;
      color: #666;
    }

    .btn-cancel:hover { background: #e0e0e0; }

    .event-list-section {
      margin-top: 20px;
      color: white;
    }

    .event-list-section h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .event-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .event-card {
      background: rgba(255,255,255,0.92);
      border-radius: 14px;
      padding: 14px;
      border-left: 4px solid #667eea;
      animation: fadeUp 0.4s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .event-card.romantic { border-left-color: #ff6b81; }
    .event-card.important { border-left-color: #667eea; }
    .event-card.fun { border-left-color: #48b1bf; }

    .event-card h4 {
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 4px;
    }

    .event-card .event-date-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
    }

    .event-card p {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.4;
    }

    .event-card .event-type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 600;
      color: white;
      margin-top: 6px;
    }

    .badge-romantic { background: #ff6b81; }
    .badge-important { background: #667eea; }
    .badge-fun { background: #48b1bf; }

    .empty-events {
      text-align: center;
      opacity: 0.7;
      padding: 20px;
    }

    .empty-events i { font-size: 2.5rem; margin-bottom: 10px; display: block; }

    @media (max-width: 768px) {
      header { padding: 10px 15px; }
      .header-center h1 { font-size: 1.1rem; }
      .cal-day { min-height: 55px; padding: 3px; }
      .day-event { font-size: 0.55rem; padding: 1px 3px; }
      .event-cards { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .cal-header span { font-size: 0.7rem; }
      .cal-day .day-num { font-size: 0.75rem; }
      .calendar-grid { padding: 8px; }
      .cal-day { min-height: 48px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Kembali
    </a>
    <div class="header-center">
      <h1>Kalender Bersama</h1>
      <p>Event penting kita</p>
    </div>
    <div style="width: 80px;"></div>
  </header>

  <div class="main-content">
    <div class="calendar-nav">
      <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="calendar-grid">
      <div class="cal-header">
        <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>

    <div class="event-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#ff6b81"></div> Romantis</div>
      <div class="legend-item"><div class="legend-dot" style="background:#667eea"></div> Penting</div>
      <div class="legend-item"><div class="legend-dot" style="background:#48b1bf"></div> Seru</div>
    </div>

    <button class="add-event-btn" id="addEventBtn">
      <i class="fas fa-plus"></i> Tambah Event
    </button>

    <div class="event-list-section">
      <h3>Daftar Event</h3>
      <div class="event-cards" id="eventCards">
        <div class="empty-events">
          <i class="fas fa-calendar-plus"></i>
          <p>Belum ada event. Tambahkan event pertama!</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2><i class="fas fa-calendar-plus" style="margin-right:8px;"></i>Tambah Event</h2>
      <div class="modal-field">
        <label>Judul Event</label>
        <input type="text" id="eventTitle" placeholder="Contoh: Anniversary Kita">
      </div>
      <div class="modal-field">
        <label>Tanggal</label>
        <input type="date" id="eventDate">
      </div>
      <div class="modal-field">
        <label>Deskripsi</label>
        <textarea id="eventDesc" placeholder="Ceritakan tentang event ini..."></textarea>
      </div>
      <div class="modal-field">
        <label>Tipe Event</label>
        <select id="eventType">
          <option value="romantic">Romantis</option>
          <option value="important">Penting</option>
          <option value="fun">Seru</option>
        </select>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="cancelBtn">Batal</button>
        <button class="btn-save" id="saveBtn">Simpan</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { db } from './js/firebase-config.js';
    import { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    await requireAuth();

    const calDays = document.getElementById('calDays');
    const monthYear = document.getElementById('monthYear');
    const prevMonth = document.getElementById('prevMonth');
    const nextMonth = document.getElementById('nextMonth');
    const addEventBtn = document.getElementById('addEventBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const cancelBtn = document.getElementById('cancelBtn');
    const saveBtn = document.getElementById('saveBtn');
    const eventCards = document.getElementById('eventCards');

    const today = new Date();
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();
    let events = [];

    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    const eventsRef = collection(db, 'calendarEvents');
    const q = query(eventsRef, orderBy('createdAt', 'desc'));

    onSnapshot(q, (snapshot) => {
      events = [];
      snapshot.forEach(doc => {
        events.push({ id: doc.id, ...doc.data() });
      });
      renderCalendar();
      renderEventList();
    });

    function renderCalendar() {
      monthYear.textContent = `${months[currentMonth]} ${currentYear}`;
      calDays.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day empty';
        calDays.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'cal-day';

        const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
        if (isToday) dayEl.classList.add('today');

        const dayNum = document.createElement('div');
        dayNum.className = 'day-num';
        dayNum.textContent = d;
        dayEl.appendChild(dayNum);

        const dayEvents = events.filter(e => e.date === dateStr);
        if (dayEvents.length > 0) {
          const evContainer = document.createElement('div');
          evContainer.className = 'day-events';
          dayEvents.slice(0, 3).forEach(ev => {
            const evEl = document.createElement('div');
            evEl.className = `day-event ${ev.type || 'important'}`;
            evEl.textContent = ev.title;
            evEl.title = ev.title;
            evContainer.appendChild(evEl);
          });
          dayEl.appendChild(evContainer);
        }

        calDays.appendChild(dayEl);
      }
    }

    function renderEventList() {
      if (events.length === 0) {
        eventCards.innerHTML = `
          <div class="empty-events">
            <i class="fas fa-calendar-plus"></i>
            <p>Belum ada event. Tambahkan event pertama!</p>
          </div>`;
        return;
      }

      eventCards.innerHTML = '';
      const sorted = [...events].sort((a,b) => (a.date || '').localeCompare(b.date || ''));
      sorted.forEach(ev => {
        const card = document.createElement('div');
        card.className = `event-card ${ev.type || 'important'}`;
        const displayDate = ev.date ? new Date(ev.date + 'T00:00:00').toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) : '';
        const typeLabel = ev.type === 'romantic' ? 'Romantis' : ev.type === 'fun' ? 'Seru' : 'Penting';
        const badgeClass = ev.type === 'romantic' ? 'badge-romantic' : ev.type === 'fun' ? 'badge-fun' : 'badge-important';
        card.innerHTML = `
          <h4>${escapeHtml(ev.title)}</h4>
          <div class="event-date-label"><i class="fas fa-clock"></i> ${displayDate}</div>
          ${ev.description ? `<p>${escapeHtml(ev.description)}</p>` : ''}
          <span class="event-type-badge ${badgeClass}">${typeLabel}</span>`;
        eventCards.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    prevMonth.addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    });

    nextMonth.addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    });

    addEventBtn.addEventListener('click', () => {
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDate').value = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      document.getElementById('eventDesc').value = '';
      document.getElementById('eventType').value = 'romantic';
      modalOverlay.classList.add('active');
    });

    cancelBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    saveBtn.addEventListener('click', async () => {
      const title = document.getElementById('eventTitle').value.trim();
      const date = document.getElementById('eventDate').value;
      const description = document.getElementById('eventDesc').value.trim();
      const type = document.getElementById('eventType').value;

      if (!title || !date) { alert('Judul dan tanggal harus diisi!'); return; }

      try {
        await addDoc(eventsRef, { title, date, description, type, createdAt: serverTimestamp() });
        modalOverlay.classList.remove('active');
      } catch (e) {
        alert('Gagal menyimpan event: ' + e.message);
      }
    });
  </script>
</body>
</html>
