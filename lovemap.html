<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Cinta Kita - Luminacc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #8d6e63 0%, #a1887f 25%, #bcaaa4 50%, #d7ccc8 75%, #efebe9 100%);
      min-height: 100vh;
      padding-top: 120px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 18px 20px;
      background: linear-gradient(135deg, #6d4c41, #8d6e63, #a1887f);
      color: white;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    header h1 {
      font-family: 'Dancing Script', cursive;
      margin: 0;
      font-size: 2rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 15px;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.45);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .locations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .location-card {
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(109,76,65,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.6s forwards;
    }

    .location-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(109,76,65,0.25);
    }

    .location-card-header {
      background: linear-gradient(135deg, #8d6e63, #a1887f);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
    }

    .location-pin {
      font-size: 1.8rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .location-card-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .location-card-body {
      padding: 18px 20px;
    }

    .location-date {
      font-size: 0.8rem;
      color: #8d6e63;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location-desc {
      font-size: 0.9rem;
      color: #5d4037;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .location-map-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #6d4c41, #8d6e63);
      color: white;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .location-map-link:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(109,76,65,0.3);
    }

    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 30px auto 20px;
      padding: 14px 30px;
      background: linear-gradient(135deg, #6d4c41, #8d6e63);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(109,76,65,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .add-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(109,76,65,0.4);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #5d4037;
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 1.1rem;
      opacity: 0.7;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h2 {
      font-family: 'Dancing Script', cursive;
      color: #5d4037;
      margin-bottom: 20px;
      font-size: 1.6rem;
    }

    .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #999;
      cursor: pointer;
      transition: color 0.3s;
    }

    .modal-close:hover { color: #333; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #5d4037;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #d7ccc8;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      transition: border-color 0.3s;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #8d6e63;
      background: white;
    }

    .form-group textarea {
      height: 90px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #6d4c41, #8d6e63);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(109,76,65,0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding-top: 100px; }
      header { padding: 15px; }
      header h1 { font-size: 1.5rem; }
      header p { font-size: 0.8rem; }
      .back-btn { padding: 6px 12px; font-size: 13px; }
      .locations-grid { grid-template-columns: 1fr; gap: 15px; }
      .container { padding: 15px; }
    }

    @media (max-width: 576px) {
      header h1 { font-size: 1.3rem; }
      .location-card-header h3 { font-size: 1rem; }
      .location-card-body { padding: 14px 16px; }
      .modal { padding: 22px; margin: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    <h1>Peta Cinta Kita</h1>
    <p>Lokasi-lokasi berharga dalam perjalanan kita</p>
  </header>

  <div class="container">
    <div class="locations-grid" id="locationsGrid">
      <div class="empty-state" id="emptyState" style="grid-column: 1 / -1;">
        <i class="fas fa-map-marker-alt"></i>
        <p>Belum ada lokasi. Tambahkan lokasi pertama!</p>
      </div>
    </div>

    <button class="add-btn" id="addBtn">
      <i class="fas fa-plus-circle"></i> Tambah Lokasi Baru
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2><i class="fas fa-map-pin"></i> Tambah Lokasi</h2>
      <form id="locationForm">
        <div class="form-group">
          <label for="locName">Nama Lokasi</label>
          <input type="text" id="locName" placeholder="Contoh: Taman Mini Indonesia Indah" required />
        </div>
        <div class="form-group">
          <label for="locDate">Tanggal Kunjungan</label>
          <input type="date" id="locDate" required />
        </div>
        <div class="form-group">
          <label for="locDesc">Deskripsi / Kenangan</label>
          <textarea id="locDesc" placeholder="Ceritakan kenangan di lokasi ini..." required></textarea>
        </div>
        <div class="form-group">
          <label for="locMapLink">Link Google Maps</label>
          <input type="url" id="locMapLink" placeholder="https://maps.google.com/..." required />
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-save"></i> Simpan Lokasi
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { db } from './js/firebase-config.js';
    import {
      collection, addDoc, onSnapshot, query, orderBy, Timestamp, deleteDoc, doc
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    requireAuth();

    const grid = document.getElementById('locationsGrid');
    const emptyState = document.getElementById('emptyState');
    const addBtn = document.getElementById('addBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const form = document.getElementById('locationForm');
    const submitBtn = document.getElementById('submitBtn');

    addBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    function formatDate(dateValue) {
      const opts = { year: 'numeric', month: 'long', day: 'numeric' };
      const d = dateValue?.toDate ? dateValue.toDate() : new Date(dateValue);
      return d.toLocaleDateString('id-ID', opts);
    }

    function createLocationCard(data, id) {
      const card = document.createElement('div');
      card.className = 'location-card';
      card.innerHTML = `
        <div class="location-card-header">
          <span class="location-pin"><i class="fas fa-map-marker-alt"></i></span>
          <h3>${data.name}</h3>
        </div>
        <div class="location-card-body">
          <div class="location-date">
            <i class="fas fa-calendar-alt"></i> ${formatDate(data.date)}
          </div>
          <p class="location-desc">${data.description}</p>
          <a href="${data.mapLink}" target="_blank" rel="noopener noreferrer" class="location-map-link">
            <i class="fas fa-directions"></i> Buka di Maps
          </a>
        </div>
      `;
      return card;
    }

    function listenToLocations() {
      const q = query(collection(db, "loveLocations"), orderBy("date", "desc"));
      onSnapshot(q, (snapshot) => {
        grid.innerHTML = '';
        if (snapshot.empty) {
          grid.appendChild(emptyState);
          emptyState.style.display = 'block';
          return;
        }
        emptyState.style.display = 'none';
        let delay = 0;
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const card = createLocationCard(data, docSnap.id);
          card.style.animationDelay = `${delay * 0.1}s`;
          grid.appendChild(card);
          delay++;
        });
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

      try {
        await addDoc(collection(db, "loveLocations"), {
          name: document.getElementById('locName').value,
          date: Timestamp.fromDate(new Date(document.getElementById('locDate').value)),
          description: document.getElementById('locDesc').value,
          mapLink: document.getElementById('locMapLink').value,
          createdAt: Timestamp.now()
        });
        form.reset();
        modalOverlay.classList.remove('active');
      } catch (err) {
        console.error("Error saving location:", err);
        alert("Gagal menyimpan lokasi: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Lokasi';
      }
    });

    listenToLocations();
  </script>
</body>
</html>
