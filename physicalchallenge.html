<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tantangan Fisik Romantis - MyMemories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a56 0%, #ffcd94 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header h1 {
            color: #fff;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .header p {
            color: #fff;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 100;
        }

        .back-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .category-btn:hover,
        .category-btn.active {
            background: #ff6b6b;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .random-btn {
            display: block;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s;
        }

        .random-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .card-container {
            perspective: 1000px;
            max-width: 400px;
            margin: 0 auto 40px;
        }

        .challenge-card {
            position: relative;
            width: 100%;
            height: 300px;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            cursor: pointer;
        }

        .challenge-card.flipped {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card-front {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe0d0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card-front .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .card-front h2 {
            color: #ff6b6b;
            font-size: 1.8rem;
            text-align: center;
        }

        .card-front p {
            color: #666;
            margin-top: 10px;
            text-align: center;
        }

        .card-back {
            background: linear-gradient(135deg, #fff 0%, #fff5f0 100%);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card-back h2 {
            color: #ff6b6b;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .card-back p {
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-meta {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 0.9rem;
        }

        .difficulty {
            color: #ff6b6b;
            font-size: 1.2rem;
        }

        .flip-hint {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-style: italic;
            opacity: 0.9;
        }

        .history-section {
            max-width: 600px;
            margin: 0 auto;
        }

        .history-section h2 {
            color: #fff;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .history-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            animation: slideIn 0.3s ease;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-item .icon {
            font-size: 2rem;
        }

        .history-item .info h3 {
            color: #333;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .history-item .info p {
            color: #888;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 1rem;
            }

            .categories {
                gap: 10px;
            }

            .category-btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .card-container {
                margin: 0 10px 30px;
            }

            .challenge-card {
                height: 280px;
            }

            .card-front h2 {
                font-size: 1.4rem;
            }

            .history-list {
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>

    <div class="header">
        <h1>Tantangan Fisik Romantis</h1>
        <p>Tantangan mesra untuk pasangan</p>
    </div>

    <div class="categories">
        <button class="category-btn active" data-category="semua">Semua</button>
        <button class="category-btn" data-category="pelukan">Pelukan</button>
        <button class="category-btn" data-category="ciuman">Ciuman</button>
        <button class="category-btn" data-category="pijat">Pijat</button>
        <button class="category-btn" data-category="dance">Dance</button>
        <button class="category-btn" data-category="masak">Masak Bareng</button>
    </div>

    <button class="random-btn" id="randomBtn">🎲 Tantangan Acak</button>

    <p class="flip-hint">Klik kartu untuk membalik dan melihat tantangan</p>

    <div class="card-container">
        <div class="challenge-card" id="challengeCard">
            <div class="card-front">
                <div class="icon">💕</div>
                <h2 id="cardTitle">Pilih Kategori</h2>
                <p id="cardPreview">Klik tombol atau pilih kategori untuk memulai</p>
            </div>
            <div class="card-back">
                <h2 id="backTitle">-</h2>
                <p id="backDesc">-</p>
                <div class="difficulty" id="backDifficulty">-</div>
                <div class="card-meta">
                    <span id="backDuration">⏱️ -</span>
                    <span id="backCategory">📁 -</span>
                </div>
            </div>
        </div>
    </div>

    <div class="history-section">
        <h2>Riwayat Tantangan</h2>
        <div class="history-list" id="historyList">
            <div class="empty-state">
                <div class="icon">📝</div>
                <p>Belum ada riwayat tantangan</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth } from './js/auth.js';
        import { db } from './js/firebase-config.js';
        import { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const user = await requireAuth();
        if (!user) throw new Error('Not authenticated');

        const challenges = {
            pelukan: [
                { title: "Pelukan Pagi", description: "Peluk pasangan selama 30 detik saat bangun tidur. Rasakan kehangatan dan cinta di pagi hari.", duration: "30 detik", difficulty: 1 },
                { title: "Pelukan Berdiri", description: "Berdiri berhadapan dan peluk pasangan erat-erat selama 1 menit. Nikmati detak jantung kalian berdua.", duration: "1 menit", difficulty: 1 },
                { title: "Pelukan Dari Belakang", description: "Peluk pasangan dari belakang saat mereka sedang sibuk. Berikan kejutan hangat!", duration: "30 detik", difficulty: 2 },
                { title: "Pelukan Hujan", description: "Berdiri di bawah hujan (atau air) dan peluk pasangan. Romantic!", duration: "2 menit", difficulty: 3 },
                { title: "Pelukan Sofa", description: "Duduk di sofa dan peluk pasangan sambil menonton film favorit.", duration: "15 menit", difficulty: 1 },
            ],
            ciuman: [
                { title: "Ciuman Dahi", description: "Cium dahi pasangan dengan lembut. Tunjukkan kasih sayang tulus.", duration: "5 detik", difficulty: 1 },
                { title: "Ciuman Pipi", description: "Cium kedua pipi pasangan bergantian. Manis dan romantis!", duration: "10 detik", difficulty: 1 },
                { title: "Ciuman Tangan", description: "Cium tangan pasangan sebagai tanda penghormatan dan cinta.", duration: "10 detik", difficulty: 1 },
                { title: "Ciuman Hujan", description: "Cium pasangan di tengah hujan (atau shower). Movie moment!", duration: "30 detik", difficulty: 3 },
                { title: "Ciuman Selamat Pagi", description: "Cium pasangan selamat pagi saat baru bangun. Momen paling manis!", duration: "10 detik", difficulty: 1 },
            ],
            pijat: [
                { title: "Pijat Bahu", description: "Pijat bahu pasangan setelah seharian bekerja. Hilangkan stres mereka.", duration: "10 menit", difficulty: 1 },
                { title: "Pijat Kaki", description: "Pijat kaki pasangan dengan lembut. Mereka pasti akan menyukainya.", duration: "15 menit", difficulty: 2 },
                { title: "Pijat Kepala", description: "Pijat kepala pasangan dengan gerakan melingkar. Sangat rileks!", duration: "10 menit", difficulty: 1 },
                { title: "Pijat Punggung", description: "Pijat punggung pasangan dengan teknik yang benar. Meringankan beban.", duration: "15 menit", difficulty: 2 },
                { title: "Pijat Romantis", description: "Pijat seluruh tubuh pasangan dengan lilin dan musik lembut.", duration: "30 menit", difficulty: 3 },
            ],
            dance: [
                { title: "Slow Dance", description: "Tari pelan berdua dengan lagu romantis favorit kalian.", duration: "3 menit", difficulty: 1 },
                { title: "Dance Challenge", description: "Coba tantangan dance viral di TikTok bersama-sama!", duration: "5 menit", difficulty: 2 },
                { title: "Karaoke Dance", description: "Nyanyi dan tari lagu karaoke favorit berdua. Fun!", duration: "10 menit", difficulty: 2 },
                { title: "Dance under Stars", description: "Tari di bawah bintang atau langit malam. Sangat romantis!", duration: "5 menit", difficulty: 3 },
                { title: "Dance Masak", description: "Masak sambil berjoget di dapur. Fun dan productive!", duration: "30 menit", difficulty: 2 },
            ],
            masak: [
                { title: "Masak Sarapan", description: "Masak sarapan spesial untuk pasangan. Surprise mereka!", duration: "30 menit", difficulty: 2 },
                { title: "Baking Bersama", description: "Buat kue atau cookies bersama-sama. Manis seperti hubungan kalian.", duration: "1 jam", difficulty: 2 },
                { title: "Masak Makanan Baru", description: "Coba resep baru yang belum pernah dibuat sebelumnya.", duration: "1 jam", difficulty: 3 },
                { title: "Smoothie Bowl", description: "Buat smoothie bowl sehat dan cantik untuk berdua.", duration: "15 menit", difficulty: 1 },
                { title: "Dinner Romantis", description: "Masak dinner lengkap dengan lilin dan dekorasi.", duration: "2 jam", difficulty: 3 },
            ]
        };

        const icons = {
            pelukan: "🤗",
            ciuman: "💋",
            pijat: "💆",
            dance: "💃",
            masak: "👨‍🍳"
        };

        let currentCategory = "semua";
        let currentChallenge = null;
        let history = [];

        const historyRef = collection(db, 'physicalChallengeHistory');
        const historyQuery = query(historyRef, orderBy('createdAt', 'desc'), limit(20));

        const challengeCard = document.getElementById('challengeCard');
        const randomBtn = document.getElementById('randomBtn');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const historyList = document.getElementById('historyList');

        onSnapshot(historyQuery, (snapshot) => {
            history = [];
            snapshot.forEach(doc => {
                history.push({ id: doc.id, ...doc.data() });
            });
            renderHistory();
        });

        function getAllChallenges() {
            if (currentCategory === "semua") {
                return Object.entries(challenges).flatMap(([cat, items]) =>
                    items.map(item => ({ ...item, category: cat }))
                );
            }
            return challenges[currentCategory].map(item => ({ ...item, category: currentCategory }));
        }

        function displayChallenge(challenge) {
            currentChallenge = challenge;
            challengeCard.classList.remove('flipped');

            setTimeout(() => {
                document.getElementById('cardTitle').textContent = challenge.title;
                document.getElementById('cardPreview').textContent = challenge.category.charAt(0).toUpperCase() + challenge.category.slice(1);
                document.getElementById('backTitle').textContent = challenge.title;
                document.getElementById('backDesc').textContent = challenge.description;
                document.getElementById('backDifficulty').textContent = '❤️'.repeat(challenge.difficulty) + '🤍'.repeat(3 - challenge.difficulty);
                document.getElementById('backDuration').textContent = '⏱️ ' + challenge.duration;
                document.getElementById('backCategory').textContent = icons[challenge.category] + ' ' + challenge.category.charAt(0).toUpperCase() + challenge.category.slice(1);

                challengeCard.classList.add('flipped');
            }, 100);
        }

        function getRandomChallenge() {
            const all = getAllChallenges();
            const random = all[Math.floor(Math.random() * all.length)];
            displayChallenge(random);
            addToHistory(random);
        }

        async function addToHistory(challenge) {
            try {
                await addDoc(historyRef, {
                    title: challenge.title,
                    description: challenge.description,
                    duration: challenge.duration,
                    difficulty: challenge.difficulty,
                    category: challenge.category,
                    createdAt: serverTimestamp()
                });
            } catch (e) {
                console.error('Error saving history:', e);
            }
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>Belum ada riwayat tantangan</p></div>';
                return;
            }

            historyList.innerHTML = history.map(item => {
                const time = item.createdAt?.toDate ? item.createdAt.toDate() : new Date(item.createdAt);
                return `
                <div class="history-item">
                    <div class="icon">${icons[item.category]}</div>
                    <div class="info">
                        <h3>${item.title}</h3>
                        <p>${time.toLocaleString('id-ID')} • ${'❤️'.repeat(item.difficulty)}</p>
                    </div>
                </div>`;
            }).join('');
        }

        randomBtn.addEventListener('click', getRandomChallenge);

        challengeCard.addEventListener('click', () => {
            if (currentChallenge) {
                challengeCard.classList.toggle('flipped');
            }
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                getRandomChallenge();
            });
        });

        renderHistory();
    </script>
</body>
</html>
