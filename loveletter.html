<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surat Cinta Virtual - Luminacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
      font-family: 'Poppins', sans-serif;
      color: #4a1a2e;
      min-height: 100vh;
      padding-top: 120px;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #e91e63, #ad1457);
      color: white;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(173,20,87,0.3);
    }

    header h1 { margin: 0; font-size: 2.2rem; font-family: 'Dancing Script', cursive; }
    header p { margin: 8px 0 0; font-size: 1rem; color: #fce4ec; }

    .back-btn {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.2); border: none; color: white;
      padding: 8px 15px; border-radius: 20px; cursor: pointer;
      text-decoration: none; font-size: 16px; transition: background 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .container {
      max-width: 800px; margin: 0 auto; padding: 30px 20px;
    }

    .builder-card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .builder-card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: #ad1457;
      margin-bottom: 25px;
      text-align: center;
    }

    .template-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .template-option {
      padding: 15px 10px;
      border: 2px solid #f8bbd0;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #fff;
    }

    .template-option:hover { border-color: #e91e63; background: #fce4ec; }
    .template-option.selected { border-color: #e91e63; background: #fce4ec; }

    .template-option .tmpl-icon { font-size: 2rem; margin-bottom: 5px; }
    .template-option .tmpl-name { font-size: 0.85rem; font-weight: 600; color: #ad1457; }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block; margin-bottom: 6px; font-weight: 600; color: #ad1457;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; padding: 12px 15px;
      border: 2px solid #f8bbd0; border-radius: 10px;
      box-sizing: border-box; background: #fff5f8;
      color: #4a1a2e; font-family: 'Poppins', sans-serif;
      font-size: 0.95rem; transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none; border-color: #e91e63;
    }

    .form-group textarea { height: 130px; resize: vertical; }

    .generate-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #e91e63, #ad1457);
      color: white; border: none; border-radius: 25px;
      cursor: pointer; font-size: 1rem; font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233,30,99,0.4);
    }

    .letter-display { display: none; }

    .letter-display.visible {
      display: block;
      animation: revealLetter 1.2s ease-out;
    }

    @keyframes revealLetter {
      0% { opacity: 0; transform: scale(0.8) translateY(30px); }
      60% { opacity: 1; transform: scale(1.02); }
      100% { transform: scale(1) translateY(0); }
    }

    .letter-paper {
      border-radius: 15px;
      padding: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    /* Template 1: Classic Pink */
    .tpl-classic {
      background: linear-gradient(135deg, #fff5f8, #fce4ec);
      border: 2px solid #f8bbd0;
    }

    .tpl-classic .letter-header-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem; color: #ad1457; text-align: center;
    }

    .tpl-classic .letter-body-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; line-height: 1.9; color: #5d3a5a;
      margin-top: 20px; text-align: justify;
    }

    .tpl-classic .letter-footer {
      font-family: 'Caveat', cursive; font-size: 1.3rem;
      color: #ad1457; text-align: right; margin-top: 30px;
    }

    /* Template 2: Midnight Romance */
    .tpl-midnight {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      border: 2px solid #533483;
      color: white;
    }

    .tpl-midnight .letter-header-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; color: #e94560; text-align: center;
    }

    .tpl-midnight .letter-body-text {
      font-family: 'Poppins', sans-serif;
      font-size: 1rem; line-height: 1.9; color: #e0e0e0;
      margin-top: 20px; text-align: justify;
    }

    .tpl-midnight .letter-footer {
      font-family: 'Dancing Script', cursive; font-size: 1.3rem;
      color: #e94560; text-align: right; margin-top: 30px;
    }

    /* Template 3: Golden Elegance */
    .tpl-golden {
      background: linear-gradient(135deg, #fff8e1, #ffecb3, #ffe082);
      border: 2px solid #ffb300;
    }

    .tpl-golden .letter-header-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem; color: #e65100; text-align: center;
    }

    .tpl-golden .letter-body-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; line-height: 1.9; color: #4e342e;
      margin-top: 20px; text-align: justify;
    }

    .tpl-golden .letter-footer {
      font-family: 'Caveat', cursive; font-size: 1.3rem;
      color: #e65100; text-align: right; margin-top: 30px;
    }

    .letter-actions {
      display: flex; gap: 12px; margin-top: 20px; justify-content: center; flex-wrap: wrap;
    }

    .letter-action-btn {
      padding: 10px 24px; border-radius: 25px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; transition: all 0.3s;
      border: 2px solid #e91e63; background: white; color: #ad1457;
    }

    .letter-action-btn:hover {
      background: #e91e63; color: white; transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(233,30,99,0.3);
    }

    .letter-ornament {
      text-align: center; font-size: 1.5rem; margin: 15px 0;
      opacity: 0.5;
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 100px; }
      header { padding: 15px; }
      header h1 { font-size: 1.8rem; }
      header p { font-size: 0.9rem; }
      .back-btn { padding: 6px 12px; font-size: 14px; }
      .builder-card { padding: 25px 20px; }
      .template-selector { grid-template-columns: 1fr; gap: 10px; }
      .letter-paper { padding: 25px 20px; }
    }

    @media screen and (max-width: 576px) {
      body { padding-top: 90px; }
      header h1 { font-size: 1.5rem; }
      .builder-card { padding: 20px 15px; }
      .builder-card h2 { font-size: 1.5rem; }
      .letter-paper { padding: 20px 15px; }
      .tpl-classic .letter-header-text,
      .tpl-midnight .letter-header-text,
      .tpl-golden .letter-header-text { font-size: 1.5rem; }
      .tpl-classic .letter-body-text,
      .tpl-midnight .letter-body-text,
      .tpl-golden .letter-body-text { font-size: 0.95rem; }
      .letter-actions { flex-direction: column; }
      .letter-action-btn { width: 100%; }
    }

    @media print {
      body { background: none; padding: 0; }
      header, .builder-card, .letter-actions { display: none !important; }
      .letter-display { display: block !important; }
      .letter-paper { box-shadow: none; margin: 0; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Kembali</a>
    <h1>Surat Cinta Virtual</h1>
    <p>Buat surat cinta untuk pasanganmu</p>
  </header>

  <div class="container">
    <div class="builder-card" id="builderCard">
      <h2>Pilih Template & Tulis Pesanmu</h2>

      <div class="template-selector">
        <div class="template-option selected" data-template="classic">
          <div class="tmpl-icon">💌</div>
          <div class="tmpl-name">Classic Pink</div>
        </div>
        <div class="template-option" data-template="midnight">
          <div class="tmpl-icon">🌙</div>
          <div class="tmpl-name">Midnight Romance</div>
        </div>
        <div class="template-option" data-template="golden">
          <div class="tmpl-icon">✨</div>
          <div class="tmpl-name">Golden Elegance</div>
        </div>
      </div>

      <div class="form-group">
        <label for="letterFrom">Dari (Nama Pengirim)</label>
        <input type="text" id="letterFrom" placeholder="Nama kamu..." />
      </div>
      <div class="form-group">
        <label for="letterTo">Kepada (Nama Penerima)</label>
        <input type="text" id="letterTo" placeholder="Nama pasanganmu..." />
      </div>
      <div class="form-group">
        <label for="letterMessage">Pesan Cinta</label>
        <textarea id="letterMessage" placeholder="Tulis kata-kata terindahmu di sini..."></textarea>
      </div>

      <button class="generate-btn" id="generateBtn">Buat Surat Cinta</button>
    </div>

    <div class="letter-display" id="letterDisplay">
      <div class="letter-paper" id="letterPaper">
        <div class="letter-ornament">♥ ♥ ♥</div>
        <div class="letter-header-text" id="letterHeader"></div>
        <div class="letter-body-text" id="letterBody"></div>
        <div class="letter-ornament">♥ ♥ ♥</div>
        <div class="letter-footer" id="letterFooter"></div>
      </div>
      <div class="letter-actions">
        <button class="letter-action-btn" id="printBtn">Cetak Surat</button>
        <button class="letter-action-btn" id="newLetterBtn">Buat Surat Baru</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    requireAuth();

    let selectedTemplate = 'classic';
    const templates = {
      classic: {
        tplClass: 'tpl-classic',
        greetings: [
          'Untukmu yang selalu di hatiku,',
          'Kekasihku tersayang,',
          'Orang tercantik di hidupku,',
          'Pendamping jiwaku,'
        ],
        closings: ['Dengan cinta selamanya', 'Selalu milikmu', 'Cintamu yang tak pernah pudar', 'Dari hatiku yang paling dalam']
      },
      midnight: {
        tplClass: 'tpl-midnight',
        greetings: [
          'Di bawah cahaya bulan ini,',
          'Untuk bintang terindahku,',
          'Kepada cahaya dalam gelapku,',
          'Untukmu, belahan jiwaku,'
        ],
        closings: ['Milikmu dalam sunyi dan nyala', 'Dalam kegelapan, kamu adalah cahayaku', 'Selamanya dan seterusnya', 'Cahaya gelapku']
      },
      golden: {
        tplClass: 'tpl-golden',
        greetings: [
          'Dengan segenap emas di hatiku,',
          'Untuk permata terindahku,',
          'Kekasihku yang bercahaya,',
          'Kepada ratu dadaku,'
        ],
        closings: ['Emas cintaku yang abadi', 'Selalu bersinar untukmu', 'Bercahaya selamanya', 'Cinta yang tak lekang']
      }
    };

    document.querySelectorAll('.template-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.template-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedTemplate = opt.dataset.template;
      });
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      const from = document.getElementById('letterFrom').value.trim();
      const to = document.getElementById('letterTo').value.trim();
      const message = document.getElementById('letterMessage').value.trim();

      if (!from || !to || !message) {
        alert('Harap isi semua kolom!');
        return;
      }

      const tpl = templates[selectedTemplate];
      const greeting = tpl.greetings[Math.floor(Math.random() * tpl.greetings.length)];
      const closing = tpl.closings[Math.floor(Math.random() * tpl.closings.length)];

      const paper = document.getElementById('letterPaper');
      paper.className = 'letter-paper ' + tpl.tplClass;

      document.getElementById('letterHeader').textContent = `${greeting} ${to}`;
      document.getElementById('letterBody').textContent = message;
      document.getElementById('letterFooter').textContent = `${closing},\n${from}`;

      document.getElementById('builderCard').style.display = 'none';
      const display = document.getElementById('letterDisplay');
      display.classList.add('visible');
      display.scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('printBtn').addEventListener('click', () => {
      window.print();
    });

    document.getElementById('newLetterBtn').addEventListener('click', () => {
      document.getElementById('letterDisplay').classList.remove('visible');
      document.getElementById('builderCard').style.display = 'block';
      document.getElementById('letterFrom').value = '';
      document.getElementById('letterTo').value = '';
      document.getElementById('letterMessage').value = '';
      document.getElementById('builderCard').scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
