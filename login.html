<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Luminacc</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #424242;
      --secondary-color: #616161;
      --accent-color: #9e9e9e;
      --text-color: #212121;
      --light-color: #f5f5f5;
      --card-bg: rgba(255, 255, 255, 0.9);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      margin:0; overflow-x:hidden;
      background: linear-gradient(135deg, #212121 0%, #424242 50%, #616161 100%);
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
    }
    .login-card {
      background: rgba(255,255,255,0.95);
      border-radius:24px;
      padding:50px 40px;
      max-width:420px;
      width:90%;
      text-align:center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(30px); }
      to { opacity:1; transform:translateY(0); }
    }
    .login-card h1 {
      font-family:'Dancing Script',cursive;
      font-size:2.5rem;
      color:var(--primary-color);
      margin-bottom:8px;
    }
    .login-card .subtitle {
      color:var(--secondary-color);
      font-size:1rem;
      margin-bottom:30px;
    }
    .login-card .heart {
      font-size:3rem;
      margin-bottom:20px;
      animation: heartbeat 1.5s infinite;
    }
    @keyframes heartbeat {
      0% { transform:scale(1); }
      14% { transform:scale(1.1); }
      28% { transform:scale(1); }
      42% { transform:scale(1.1); }
      70% { transform:scale(1); }
    }
    .google-btn {
      display:inline-flex; align-items:center; gap:12px;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      color:white; border:none; padding:14px 35px;
      border-radius:30px; cursor:pointer; font-size:16px;
      font-weight:600; transition:all 0.3s ease;
      box-shadow: 0 6px 20px rgba(255,154,158,0.4);
    }
    .google-btn:hover {
      transform:translateY(-3px); box-shadow:0 8px 25px rgba(255,154,158,0.5);
    }
    .google-btn i { font-size:20px; }
    .info {
      margin-top:25px; color:var(--accent-color); font-size:0.85rem; line-height:1.6;
    }
    .bubble {
      position:absolute; white-space:nowrap; padding:4px 8px;
      border-radius:20px; background:rgba(158,158,158,0.5);
      color:#f5f5f5; font-weight:600;
      animation-timing-function:linear; animation-iteration-count:infinite;
      z-index:1; box-shadow:0 4px 8px rgba(0,0,0,0.1);
      font-size:0.75rem;
    }
    @keyframes move-left { from{transform:translateX(120vw);} to{transform:translateX(-120vw);} }
    @keyframes move-right { from{transform:translateX(-120vw);} to{transform:translateX(120vw);} }
    @media(max-width:480px){
      .login-card{padding:35px 25px;}
      .login-card h1{font-size:2rem;}
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="heart">❤️</div>
    <h1>Luminacc</h1>
    <p class="subtitle">Website kenangan cinta kita</p>
    <button class="google-btn" id="loginBtn">
      <i class="fab fa-google"></i> Masuk dengan Google
    </button>
    <p class="info">Hanya akun yang terdaftar yang bisa mengakses website ini</p>
  </div>
  <script>
    const messages = ["Selamat Bahagia","Happy Anniversary","Luna cantik","Love Forever","Sweet Memories"];
    function createBubbles(){
      for(let i=0;i<15;i++){
        const b=document.createElement("div");b.className="bubble";
        b.textContent=messages[Math.floor(Math.random()*messages.length)];
        b.style.top=Math.random()*90+"%";
        b.style.background=`rgba(${158+Math.random()*66},${158+Math.random()*66},${158+Math.random()*66},0.5)`;
        b.style.animationDuration=(10+Math.random()*20)+"s";
        b.style.animationName=Math.random()>0.5?"move-left":"move-right";
        document.body.appendChild(b);
      }
    }
    window.addEventListener('load',createBubbles);
  </script>
  <script type="module">
    import { doLogin } from './js/auth.js';
    import { getRedirectResult } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { auth } from './js/firebase-config.js';

    // Handle redirect result on page load (from Google sign-in redirect)
    try {
      const result = await getRedirectResult(auth);
      if (result && result.user) {
        const ALLOWED = ["rianakhlulfadli@gmail.com", "lunadindaaa2220@gmail.com"];
        if (!ALLOWED.includes(result.user.email)) {
          alert('Akun ' + result.user.email + ' tidak memiliki akses.');
          window.location.href = 'login.html';
        } else {
          window.location.href = 'index.html';
        }
      }
    } catch (err) {
      console.error('Redirect result error:', err);
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Masuk...';
      await doLogin();
    });
  </script>
</body>
</html>
